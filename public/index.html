  <!-- ══════════════════════════════════════════════════════════════════
       Inyección: opción "Imagen escaneada" junto al uploader GeoJSON
       del panel administrador del municipio (equipo/configuración)
  ══════════════════════════════════════════════════════════════════ -->
  <script>
  (function() {
    // Si la URL es /dashboard/mapa (F5 o recarga tras guardar): navegar al mapa Y reinyectar sectores
    if (window.location.pathname === '/dashboard/mapa') {
      // 1. Navegar via router en cuanto esté disponible
      const _tryAutoNav = (n) => {
        if (window.router) { window.router.navigate('/dashboard/mapa'); return; }
        if (n < 40) setTimeout(() => _tryAutoNav(n + 1), 150);
      };
      _tryAutoNav(0);
      // 2. Esperar a que window.map aparezca y reinyectar la capa de sectores
      const _tryReInject = (n) => {
        const map = window.map;
        if (!map) {
          if (n < 30) setTimeout(() => _tryReInject(n + 1), 300);
          return;
        }
        const tk = localStorage.getItem('sgti_token') || '';
        if (!tk) return;
        fetch('/api/equipo/geojson/default', {
          headers: { Authorization: `Bearer ${tk}` }, credentials: 'include'
        })
        .then(r => r.json())
        .then(geo => {
          if (!geo?.features?.length) return;
          if (window._scanInjectedLayer) {
            try { map.removeLayer(window._scanInjectedLayer); } catch(_) {}
          }
          window._scanInjectedLayer = _buildSectorLayer(geo, map);
          map.fitBounds(window._scanInjectedLayer.getBounds(), { padding:[30,30] });
          window.sectoresGeoJSONFeatures = geo.features;
        })
        .catch(() => {});
      };
      setTimeout(() => _tryReInject(0), 600);
    }

    const SCAN_COLORS = ['#e63946','#2a9d8f','#e9c46a','#6a4fcf','#f4a261','#457b9d','#e76f51','#2dc653','#ff6b6b','#118ab2','#ffd166','#9b5de5'];
    // Iconos para manejadores de imagen
    const _cornerIcon = () => L.divIcon({ className:'', iconSize:[0,0],
      html:'<div style="width:14px;height:14px;background:#fff;border:2.5px solid #7c3aed;border-radius:3px;cursor:nwse-resize;margin:-7px 0 0 -7px;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>' });
    const _centerIcon = () => L.divIcon({ className:'', iconSize:[0,0],
      html:'<div style="width:22px;height:22px;background:rgba(124,58,237,.85);border:2.5px solid #fff;border-radius:50%;cursor:move;margin:-11px 0 0 -11px;box-shadow:0 2px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff">✥</div>' });

    /* ── Observar cuando aparece el dropzone de GeoJSON ─────────────── */
    const _obsGeo = new MutationObserver(() => {
      const dz = document.getElementById('geojson-dropzone');
      if (!dz || dz.dataset.scanInjected) return;
      dz.dataset.scanInjected = '1';

      const btn = document.createElement('button');
      btn.id = 'scan-sector-open-btn';
      btn.type = 'button';
      btn.style.cssText = [
        'display:flex;align-items:center;gap:8px;width:100%;margin-top:10px',
        'padding:10px 16px;border-radius:8px;border:2px dashed #7c3aed',
        'background:rgba(124,58,237,0.06);color:#a78bfa',
        'font-size:12.5px;font-weight:700;cursor:pointer',
        'justify-content:center;box-sizing:border-box'
      ].join(';');
      btn.innerHTML = `<span style="font-size:16px">🗺️</span> O dibuja sectores desde una imagen escaneada`;
      btn.onmouseenter = () => { btn.style.background = 'rgba(124,58,237,0.14)'; };
      btn.onmouseleave = () => { btn.style.background = 'rgba(124,58,237,0.06)'; };
      btn.addEventListener('click', _openScanModal);
      dz.parentNode.insertBefore(btn, dz.nextSibling);
    });
    _obsGeo.observe(document.body, { childList: true, subtree: true });

    /* ── Abrir modal ─────────────────────────────────────────────────── */
    function _openScanModal() {
      let modal = document.getElementById('scan-sector-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'scan-sector-modal';
        modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(5,10,20,0.9);display:flex;flex-direction:column';
        modal.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#0f172a;border-bottom:1px solid #1e3a5f;flex-shrink:0">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:18px">🗺️</span>
              <div>
                <div style="font-size:13px;font-weight:800;color:#e2e8f0">Sectores desde imagen escaneada</div>
                <div style="font-size:10.5px;color:#64748b">Sube tu mapa impreso → traza sectores haciendo clic → doble clic para cerrar cada uno</div>
              </div>
            </div>
            <button id="scan-modal-close" style="width:30px;height:30px;border-radius:50%;border:none;background:#1e293b;color:#94a3b8;font-size:16px;cursor:pointer;font-weight:700">✕</button>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:#0f172a;border-bottom:1px solid #1e3a5f;flex-shrink:0;flex-wrap:wrap">
            <input type="file" id="scan-img-input" accept="image/jpeg,image/png,image/webp" style="display:none">
            <button id="scan-img-btn" style="padding:5px 14px;font-size:11.5px;font-weight:700;border-radius:6px;border:none;background:#7c3aed;color:#fff;cursor:pointer">Subir imagen</button>
            <!-- Controles de ajuste (visibles solo cuando hay imagen) -->
            <div id="scan-img-adjust" style="display:none;align-items:center;gap:8px;flex-wrap:wrap">
              <span style="font-size:10.5px;color:#64748b;font-weight:600">Opacidad:</span>
              <input type="range" id="scan-opacity" min="10" max="100" value="55" style="width:80px;accent-color:#7c3aed;cursor:pointer">
              <span style="font-size:10px;color:#94a3b8">Arrastra esquinas ✦ o centro ✥ para ajustar</span>
            </div>
            <div style="width:1px;height:20px;background:#1e3a5f;flex-shrink:0"></div>
            <button id="scan-close-poly" style="padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:6px;border:none;background:#065f46;color:#6ee7b7;cursor:pointer">Cerrar sector</button>
            <button id="scan-cancel-poly" style="padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer">Cancelar trazo</button>
            <button id="scan-clear-all" style="padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:6px;border:none;background:#7f1d1d;color:#fca5a5;cursor:pointer">Borrar todo</button>
            <span id="scan-poly-count" style="font-size:11.5px;color:#64748b;margin-left:4px">0 sectores trazados</span>
            <div style="flex:1"></div>
            <button id="scan-save-btn" disabled style="padding:5px 18px;font-size:12px;font-weight:800;border-radius:6px;border:none;background:#1e3a5f;color:#64748b;cursor:not-allowed;transition:.2s">Guardar sectores</button>
          </div>
          <div id="scan-map" style="flex:1;min-height:0"></div>
          <div id="scan-status-bar" style="padding:6px 14px;background:#0f172a;border-top:1px solid #1e3a5f;font-size:11px;color:#64748b;flex-shrink:0;min-height:26px">
            Sube una imagen y luego traza los sectores haciendo clic en el mapa.
          </div>
        `;
        document.body.appendChild(modal);

        const scanMap = L.map('scan-map', { zoomControl: true, attributionControl: false, doubleClickZoom: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(scanMap);
        scanMap.setView([-12.04, -77.04], 13);
        window._scanModalMap = scanMap;

        fetch('/api/equipo/geojson/default', { credentials: 'include' })
          .then(r => r.json()).then(geo => {
            if (geo?.type === 'FeatureCollection' && geo.features?.length > 0) {
              try {
                const layer = L.geoJSON(geo, { style: { color:'#3b82f6', weight:1.5, fillOpacity:0.08 } }).addTo(scanMap);
                scanMap.fitBounds(layer.getBounds(), { padding:[20,20] });
                window._scanBaseBounds = layer.getBounds();
              } catch(e) {}
            }
          }).catch(()=>{});

        window._scanModalPts        = [];
        window._scanModalSectors    = [];
        window._scanModalLayers     = [];
        window._scanModalPolyline   = null;
        window._scanModalDots       = [];
        window._scanModalImgOverlay = null;
        window._scanClickTimer      = null;

        document.getElementById('scan-modal-close').addEventListener('click', _closeScanModal);
        document.getElementById('scan-img-btn').addEventListener('click', () => document.getElementById('scan-img-input').click());
        document.getElementById('scan-img-input').addEventListener('change', _handleScanImage);
        document.getElementById('scan-close-poly').addEventListener('click', () => {
          if (window._scanClickTimer) { clearTimeout(window._scanClickTimer); window._scanClickTimer = null; }
          if (window._scanModalPts.length >= 3) _scanClosePoly(); else _scanCancelPoly();
        });
        document.getElementById('scan-cancel-poly').addEventListener('click', _scanCancelPoly);
        document.getElementById('scan-clear-all').addEventListener('click', _scanClearAll);
        document.getElementById('scan-save-btn').addEventListener('click', _scanSave);
        scanMap.on('click', _scanClick);
        scanMap.getContainer().style.cursor = 'crosshair';
      }
      modal.style.display = 'flex';
      setTimeout(() => window._scanModalMap?.invalidateSize(), 120);
    }

    function _closeScanModal() {
      const m = document.getElementById('scan-sector-modal');
      if (m) m.style.display = 'none';
    }

    /* ── Imagen + manejadores de ajuste ─────────────────────────────── */
    function _handleScanImage(e) {
      const file = e.target.files?.[0]; if (!file) return;
      document.getElementById('scan-status-bar').textContent = 'Cargando imagen...';
      const reader = new FileReader();
      reader.onload = (ev) => {
        const map = window._scanModalMap; if (!map) return;
        _scanRemoveImgControls();
        if (window._scanModalImgOverlay) { map.removeLayer(window._scanModalImgOverlay); window._scanModalImgOverlay = null; }
        const bounds = window._scanBaseBounds || map.getBounds();
        window._scanModalImgOverlay = L.imageOverlay(ev.target.result, bounds, { opacity: 0.55, interactive: false }).addTo(map);
        map.fitBounds(bounds, { padding:[20,20] });
        _scanCreateImgControls(bounds);
        document.getElementById('scan-img-adjust').style.display = 'flex';
        document.getElementById('scan-status-bar').textContent =
          'Imagen cargada. Arrastra las esquinas ✦ o el centro ✥ para alinearla. Luego traza los sectores (clic = vértice, doble clic = cerrar sector).';
        e.target.value = '';
      };
      reader.readAsDataURL(file);
    }

    function _scanCreateImgControls(bounds) {
      const map = window._scanModalMap;
      let sw = bounds.getSouthWest(), ne = bounds.getNorthEast();

      function corners() {
        return {
          sw, ne,
          se: L.latLng(sw.lat, ne.lng),
          nw: L.latLng(ne.lat, sw.lng),
          c:  L.latLng((sw.lat+ne.lat)/2, (sw.lng+ne.lng)/2),
        };
      }
      function reposition() {
        const c = corners();
        mSW.setLatLng(c.sw); mNE.setLatLng(c.ne);
        mSE.setLatLng(c.se); mNW.setLatLng(c.nw);
        mC.setLatLng(c.c);
        window._scanModalImgOverlay.setBounds(L.latLngBounds(sw, ne));
        window._scanBaseBounds = L.latLngBounds(sw, ne);
      }

      const mSW = L.marker(corners().sw, { draggable:true, icon:_cornerIcon(), zIndexOffset:1000 }).addTo(map);
      const mNE = L.marker(corners().ne, { draggable:true, icon:_cornerIcon(), zIndexOffset:1000 }).addTo(map);
      const mSE = L.marker(corners().se, { draggable:true, icon:_cornerIcon(), zIndexOffset:1000 }).addTo(map);
      const mNW = L.marker(corners().nw, { draggable:true, icon:_cornerIcon(), zIndexOffset:1000 }).addTo(map);
      const mC  = L.marker(corners().c,  { draggable:true, icon:_centerIcon(), zIndexOffset:1001 }).addTo(map);

      // Arrastar esquinas — cada una mueve sus dos coordenadas
      mSW.on('drag', ev => { sw = L.latLng(ev.latlng.lat, ev.latlng.lng); reposition(); });
      mNE.on('drag', ev => { ne = L.latLng(ev.latlng.lat, ev.latlng.lng); reposition(); });
      mSE.on('drag', ev => { sw = L.latLng(ev.latlng.lat, sw.lng); ne = L.latLng(ne.lat, ev.latlng.lng); reposition(); });
      mNW.on('drag', ev => { ne = L.latLng(ev.latlng.lat, ev.latlng.lng); sw = L.latLng(sw.lat, ne.lng); ne = L.latLng(ev.latlng.lat, ne.lng); reposition(); });

      // Arrastar centro — desplaza toda la imagen
      let _prevC = null;
      mC.on('dragstart', () => { _prevC = mC.getLatLng(); });
      mC.on('drag', ev => {
        if (!_prevC) return;
        const dLat = ev.latlng.lat - _prevC.lat;
        const dLng = ev.latlng.lng - _prevC.lng;
        sw = L.latLng(sw.lat+dLat, sw.lng+dLng);
        ne = L.latLng(ne.lat+dLat, ne.lng+dLng);
        _prevC = ev.latlng;
        reposition();
      });

      // Slider de opacidad
      const opSlider = document.getElementById('scan-opacity');
      if (opSlider) {
        opSlider.oninput = () => { window._scanModalImgOverlay?.setOpacity(+opSlider.value / 100); };
      }

      window._scanImgControlMarkers = [mSW, mNE, mSE, mNW, mC];
    }

    function _scanRemoveImgControls() {
      (window._scanImgControlMarkers || []).forEach(m => window._scanModalMap?.removeLayer(m));
      window._scanImgControlMarkers = [];
    }

    /* ── Dibujo ──────────────────────────────────────────────────────── */
    // Timer de 150ms: si llega un 2.º clic antes de que expire → doble clic → cerrar sector
    function _scanClick(e) {
      if (window._scanClickTimer) {
        clearTimeout(window._scanClickTimer);
        window._scanClickTimer = null;
        if (window._scanModalPts.length >= 3) _scanClosePoly(); else _scanCancelPoly();
        return;
      }
      window._scanClickTimer = setTimeout(() => {
        window._scanClickTimer = null;
        const pt = [e.latlng.lat, e.latlng.lng];
        window._scanModalPts.push(pt);
        const dot = L.circleMarker(pt, { radius:4, color:'#a78bfa', fillColor:'#a78bfa', fillOpacity:1, weight:1 }).addTo(window._scanModalMap);
        window._scanModalDots.push(dot);
        if (window._scanModalPolyline) window._scanModalMap.removeLayer(window._scanModalPolyline);
        if (window._scanModalPts.length >= 2)
          window._scanModalPolyline = L.polyline(window._scanModalPts, { color:'#a78bfa', weight:2, dashArray:'5 4' }).addTo(window._scanModalMap);
        const n = window._scanModalPts.length;
        const sb = document.getElementById('scan-status-bar');
        if (sb) sb.textContent = n === 1 ? 'Vértice 1 agregado. Sigue haciendo clic para trazar el sector.'
          : `${n} vértices. Doble clic o "Cerrar sector" para completar el sector.`;
      }, 150);
    }

    function _scanUpdateCounter() {
      const n = window._scanModalSectors.length;
      document.getElementById('scan-poly-count').textContent = `${n} sector${n!==1?'es':''} trazado${n!==1?'s':''}`;
      const sb = document.getElementById('scan-save-btn');
      if (n > 0) { sb.disabled = false; sb.style.background = '#16a34a'; sb.style.color = '#fff'; sb.style.cursor = 'pointer'; }
      else        { sb.disabled = true;  sb.style.background = '#1e3a5f'; sb.style.color = '#64748b'; sb.style.cursor = 'not-allowed'; }
    }

    function _scanDeleteSector(layerRef) {
      // Eliminar de arrays por referencia
      const li = window._scanModalLayers.indexOf(layerRef);
      if (li !== -1) {
        window._scanModalMap.removeLayer(window._scanModalLayers[li]);
        window._scanModalLayers.splice(li, 1);
        window._scanModalSectors.splice(li, 1);
        // Re-numerar los sectores restantes y sus tooltips
        window._scanModalSectors.forEach((f, i) => {
          f.properties.fid = i+1; f.properties.id = i+1; f.properties.Name = `Sector ${i+1}`;
          const lyr = window._scanModalLayers[i];
          lyr.closeTooltip(); lyr.unbindTooltip();
          lyr.bindTooltip(`Sector ${i+1}`, { permanent:true, direction:'center', className:'leaflet-tooltip-mini' });
        });
        _scanUpdateCounter();
        document.getElementById('scan-status-bar').textContent = 'Sector eliminado. Sigue trazando o guarda los restantes.';
      }
    }

    function _scanClosePoly() {
      const pts = window._scanModalPts; if (pts.length < 3) return;
      const idx   = window._scanModalSectors.length + 1;
      const color = SCAN_COLORS[(idx-1) % SCAN_COLORS.length];
      const poly  = L.polygon(pts, { color:'#fff', weight:2, fillColor:color, fillOpacity:0.68 }).addTo(window._scanModalMap);
      poly.bindTooltip(`Sector ${idx}`, { permanent:true, direction:'center', className:'leaflet-tooltip-mini' });
      // Popup de eliminación al hacer clic en el polígono
      poly.on('click', function(e) {
        // Detener propagación al mapa para que no añada un vértice
        if (e.originalEvent) { e.originalEvent.stopPropagation(); e.originalEvent.preventDefault(); }
        L.DomEvent.stop(e);
        if (window._scanClickTimer) { clearTimeout(window._scanClickTimer); window._scanClickTimer = null; }
        const self = this;
        window.__scanPopupLayer = self;
        const nombre = self.getTooltip()?.getContent() || 'Sector';
        L.popup({ closeButton:true, autoClose:true })
          .setLatLng(e.latlng)
          .setContent(`<div style="text-align:center;padding:2px 4px">
            <div style="font-size:12px;font-weight:700;color:#1e293b;margin-bottom:8px">${nombre}</div>
            <button onclick="window._scanDeleteSector(window.__scanPopupLayer)" style="width:100%;padding:6px 12px;background:#dc2626;color:#fff;border:none;border-radius:5px;font-size:11.5px;font-weight:700;cursor:pointer">Eliminar este sector</button>
          </div>`)
          .openOn(window._scanModalMap);
      });
      window._scanModalLayers.push(poly);
      const ring = [...pts.map(p=>[p[1],p[0]]), [pts[0][1],pts[0][0]]];
      window._scanModalSectors.push({ type:'Feature', properties:{ fid:idx, id:idx, Name:`Sector ${idx}` }, geometry:{ type:'Polygon', coordinates:[ring] } });
      _scanClearTrace();
      _scanUpdateCounter();
      document.getElementById('scan-status-bar').textContent = `✓ Sector ${idx} cerrado. Clic en un sector para eliminarlo. Sigue trazando o guarda.`;
    }

    function _scanCancelPoly() {
      _scanClearTrace();
      document.getElementById('scan-status-bar').textContent = 'Trazo cancelado. Haz clic para empezar de nuevo.';
    }

    function _scanClearTrace() {
      if (window._scanModalPolyline) { window._scanModalMap.removeLayer(window._scanModalPolyline); window._scanModalPolyline = null; }
      window._scanModalDots.forEach(d => window._scanModalMap.removeLayer(d));
      window._scanModalDots = []; window._scanModalPts = [];
    }

    function _scanClearAll() {
      _scanClearTrace();
      _scanRemoveImgControls();
      if (window._scanModalImgOverlay) { window._scanModalMap?.removeLayer(window._scanModalImgOverlay); window._scanModalImgOverlay = null; }
      window._scanModalLayers.forEach(l => window._scanModalMap.removeLayer(l));
      window._scanModalLayers = []; window._scanModalSectors = [];
      _scanUpdateCounter();
      document.getElementById('scan-img-adjust').style.display = 'none';
      document.getElementById('scan-status-bar').textContent = 'Todo borrado. Sube una nueva imagen o traza de nuevo.';
      const sb = document.getElementById('scan-save-btn');
      sb.disabled = true; sb.style.background = '#1e3a5f'; sb.style.color = '#64748b'; sb.style.cursor = 'not-allowed';
    }

    /* ── Guardar al servidor ─────────────────────────────────────────── */
    async function _scanSave() {
      if (!window._scanModalSectors.length) return;
      const sb  = document.getElementById('scan-save-btn');
      const bar = document.getElementById('scan-status-bar');
      sb.disabled = true; sb.textContent = 'Guardando...';
      bar.textContent = 'Enviando sectores al servidor...';
      const geojson = { type:'FeatureCollection', features: window._scanModalSectors };
      try {
        const tk  = localStorage.getItem('sgti_token') || '';
        const res = await fetch('/api/equipo/upload-geojson', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', Authorization:`Bearer ${tk}` },
          credentials: 'include',
          body: JSON.stringify(geojson),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
        bar.innerHTML = '<span style="color:#4ade80;font-weight:700">✓ Sectores guardados. Cargando en el mapa...</span>';
        sb.textContent = '✓ Guardado';

        // Navegar al mapa vía router SPA
        if (window.router) window.router.navigate('/dashboard/mapa');

        // Esperar a que window.map esté activo e inyectar la capa
        setTimeout(async () => {
          const COLORS = ['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6','#fb923c','#22d3ee'];
          const tryInject = async (attempt) => {
            const map = window.map;
            if (!map) {
              if (attempt < 10) return setTimeout(() => tryInject(attempt+1), 400);
              return;
            }
            try {
              const tkk = localStorage.getItem('sgti_token') || '';
              const r2  = await fetch('/api/equipo/geojson/default', {
                headers: { Authorization: `Bearer ${tkk}` }, credentials: 'include'
              });
              const geo = await r2.json();
              if (!geo?.features?.length) { _closeScanModal(); return; }
              if (window._scanInjectedLayer) {
                try { map.removeLayer(window._scanInjectedLayer); } catch(_) {}
                window._scanInjectedLayer = null;
              }
              window._scanInjectedLayer = _buildSectorLayer(geo, map);
              map.fitBounds(window._scanInjectedLayer.getBounds(), { padding:[30,30] });
              window.sectoresGeoJSONFeatures = geo.features;
              history.replaceState({}, '', '/dashboard/mapa');
              bar.innerHTML = '<span style="color:#4ade80;font-weight:700">Sectores visibles. Haz clic en uno para editar nombre o eliminar.</span>';
              setTimeout(() => _closeScanModal(), 2500);
            } catch(e2) { console.error('[scanSave]', e2.message); }
          };
          tryInject(0);
        }, 600);
      } catch(err) {
        bar.innerHTML = `<span style="color:#f87171">Error: ${err.message}</span>`;
        sb.disabled = false; sb.textContent = 'Guardar sectores';
      }
    }

    // Construye el L.geoJSON con popup de edición (usado tanto al guardar como al recargar)
    function _buildSectorLayer(geo, map) {
      const COLORS = ['#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6','#fb923c','#22d3ee'];
      return L.geoJSON(geo, {
        style: f => ({
          fillColor: COLORS[((f.properties.id||1)-1) % COLORS.length],
          weight: 2, opacity: 0.9, color: 'white',
          dashArray: '2', fillOpacity: 0.45
        }),
        onEachFeature: (f, layer) => {
          const nm = f.properties.Name || 'Sector';
          layer.bindTooltip(nm, { permanent:true, direction:'center', className:'leaflet-tooltip-mini' });
          layer.on('click', function(e) {
            if (e.originalEvent) e.originalEvent.stopPropagation();
            window.__scanEditLayer   = this;
            window.__scanEditFeature = f;
            const cur = f.properties.Name || 'Sector';
            L.popup({ closeButton:true, autoClose:true })
              .setLatLng(e.latlng)
              .setContent(`<div style="min-width:180px;padding:4px 2px">
                <div style="font-size:11px;color:#94a3b8;margin-bottom:6px;font-weight:600;letter-spacing:.05em">EDITAR SECTOR</div>
                <input id="_scanRenameInput" type="text" value="${cur.replace(/"/g,'&quot;')}"
                  style="width:100%;box-sizing:border-box;padding:5px 8px;background:#0f172a;border:1px solid #334155;border-radius:5px;color:#e2e8f0;font-size:12px;margin-bottom:8px"
                  onkeydown="if(event.key==='Enter')window._scanApplyRename()">
                <div style="display:flex;gap:6px">
                  <button onclick="window._scanApplyRename()"
                    style="flex:1;padding:5px 4px;background:#3b82f6;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer">
                    Guardar nombre
                  </button>
                  <button onclick="window._scanDeleteInjectedSector()"
                    style="flex:1;padding:5px 4px;background:#dc2626;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer">
                    Eliminar
                  </button>
                </div>
              </div>`)
              .openOn(map);
          });
        }
      }).addTo(map);
    }

    // Renombrar sector inyectado desde el popup del mapa principal
    window._scanApplyRename = function() {
      const input = document.getElementById('_scanRenameInput');
      if (!input || !window.__scanEditFeature || !window.__scanEditLayer) return;
      const newName = input.value.trim();
      if (!newName) return;
      window.__scanEditFeature.properties.Name = newName;
      window.__scanEditLayer.closeTooltip();
      window.__scanEditLayer.unbindTooltip();
      window.__scanEditLayer.bindTooltip(newName, { permanent:true, direction:'center', className:'leaflet-tooltip-mini' });
      if (window.map) window.map.closePopup();
      window._scanResaveInjected();
    };

    // Eliminar sector inyectado desde el popup del mapa principal
    window._scanDeleteInjectedSector = function() {
      if (!window._scanInjectedLayer || !window.__scanEditLayer) return;
      window._scanInjectedLayer.removeLayer(window.__scanEditLayer);
      if (window.map) window.map.closePopup();
      window._scanResaveInjected();
    };

    // Re-guardar al servidor el estado actual del layer inyectado
    window._scanResaveInjected = async function() {
      const lyr = window._scanInjectedLayer;
      if (!lyr) return;
      const features = [];
      lyr.eachLayer(l => { if (l.feature) features.push(l.feature); });
      const tk = localStorage.getItem('sgti_token') || '';
      try {
        await fetch('/api/equipo/upload-geojson', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', Authorization:`Bearer ${tk}` },
          credentials: 'include',
          body: JSON.stringify({ type:'FeatureCollection', features })
        });
        window.sectoresGeoJSONFeatures = features;
      } catch(e) { console.error('[scanResave]', e.message); }
    };

    // Exponer para el botón inline del popup del modal de escaneo
    window._scanDeleteSector = _scanDeleteSector;
  })();

  // ── Sector filter dinámico: reemplaza las opciones hardcodeadas del bundle ──
  (function() {
    let _feat = null;

    function _populate(features) {
      const sel = document.getElementById('filter-sector');
      if (!sel) return;
      if (features && features.length) _feat = features;
      if (!_feat || !_feat.length) return;
      const cur = sel.value;
      sel.innerHTML = '<option value="all">Todos</option>' +
        _feat.map(f => {
          const nm = (f.properties?.Name || f.properties?.name || 'Sector').trim();
          return `<option value="${nm}">${nm}</option>`;
        }).join('');
      if (cur !== 'all' && [...sel.options].some(o => o.value === cur)) sel.value = cur;
    }

    async function _fetchAndPopulate() {
      const tk = localStorage.getItem('sgti_token') || '';
      if (!tk) return;
      try {
        const r = await fetch('/api/equipo/geojson/default', {
          headers: { Authorization: `Bearer ${tk}` }, credentials: 'include'
        });
        const geo = await r.json();
        if (geo?.features?.length) _populate(geo.features);
      } catch(e) {}
    }

    // Interceptar asignaciones a window.sectoresGeoJSONFeatures
    let _cached = window.sectoresGeoJSONFeatures;
    try {
      Object.defineProperty(window, 'sectoresGeoJSONFeatures', {
        get() { return _cached; },
        set(v) { _cached = v; if (v?.length) setTimeout(() => _populate(v), 50); },
        configurable: true
      });
    } catch(e) {}

    // Esperar a que #filter-sector aparezca en el DOM
    const _obs = new MutationObserver(() => {
      if (!document.getElementById('filter-sector')) return;
      _obs.disconnect();
      if (window.sectoresGeoJSONFeatures?.length) _populate(window.sectoresGeoJSONFeatures);
      else _fetchAndPopulate();
    });
    _obs.observe(document.documentElement, { childList: true, subtree: true });

  })();
  </script>

  <!-- Renombrar etiquetas "WhatsApp" → "Reportes Móviles" en el panel -->
  <script>
  (function() {
    // Nodos de texto cortos que son exactamente etiquetas de nav/título
    // No tocar instrucciones largas del bot (QR, vincular dispositivo, etc.)
    function reemplazarTexto(node) {
      if (node.nodeType !== Node.TEXT_NODE) return;
      const txt = node.textContent.trim();
      // Solo renombrar si el texto es exactamente "WhatsApp" o una variante corta de nav
      if (/^WhatsApp\.?$/.test(txt)) {
        node.textContent = node.textContent.replace(/WhatsApp\.?/, 'Reportes Móviles');
      }
    }

    function recorrer(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) reemplazarTexto(node);
    }

    // Aplicar tras carga inicial y observar cambios del router SPA
    const obs = new MutationObserver(muts => {
      for (const m of muts) m.addedNodes.forEach(n => {
        if (n.nodeType === Node.ELEMENT_NODE) recorrer(n);
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      recorrer(document.body);
      obs.observe(document.body, { childList: true, subtree: true });
    });
  })();
  </script>

  <!-- Parche: sub-gerencias dinámicas para gerentes -->
  <script>
  (function() {
    var _gerencias = null;

    function _getUser() {
      try { return JSON.parse(localStorage.getItem('sgti_user') || '{}'); } catch(e) { return {}; }
    }

    async function _fetchGerencias() {
      if (_gerencias) return _gerencias;
      var token = localStorage.getItem('sgti_token');
      if (!token) return [];
      try {
        var resp = await fetch('/api/equipo/gerencias', {
          headers: {'Authorization': 'Bearer ' + token},
          credentials: 'include'
        });
        if (resp.ok) {
          var data = await resp.json();
          if (Array.isArray(data)) { _gerencias = data; return data; }
        }
      } catch(e) {}
      return [];
    }

    function _fixToggle() {
      var c = document.getElementById('sidebar-gerencias-container');
      if (!c || !c.children.length) return;
      // El compiled code oculta los items del container porque su onclick no coincide
      // con la gerencia hardcodeada (p.ej. 'fiscalizacion' no pasa el filtro de 'seguridad').
      // Re-mostrar todos los items que el compilado ocultó.
      Array.from(c.children).forEach(function(el) { el.style.display = ''; });
      var toggle = c.previousElementSibling;
      if (toggle && toggle.classList.contains('gerencia-toggle')) {
        toggle.style.display = '';
        var sec = toggle.previousElementSibling;
        if (sec && sec.classList.contains('nav-section')) sec.style.display = '';
      }
    }

    // ── renderEquipoList interceptor ────────────────────────────────────────────
    // El compiled code filtra el personal client-side con gerencias hardcodeadas
    // (p.ej. seguridad→serenazgo). Para municipios con sub-áreas dinámicas,
    // re-fetcha desde la API (que ya hace el scope correcto) y re-renderiza.
    var _renderEquipoFn = null;
    var _personalCache  = null;

    function _buildEquipoTable(personal, userRol) {
      if (!personal || personal.length === 0) {
        return '<div style="padding:40px;text-align:center;color:var(--text-dim)">No se encontraron usuarios.</div>';
      }
      var rows = personal.map(function(e) {
        var canEdit = userRol === 'admin' || userRol === 'alcalde' ||
                      (userRol === 'gerente' && e.rol !== 'gerente' && e.rol !== 'admin' && e.rol !== 'alcalde');
        var rolLabel = e.rol === 'visor' ? 'Supervisor Web' :
                       e.rol === 'supervisor' ? 'Supervisor de Campo' :
                       e.rol === 'gerente' ? 'Gerente de Área' :
                       e.rol === 'admin' ? 'Administrador' :
                       e.rol === 'alcalde' ? 'Alcalde' : 'Operador de Campo';
        var rolCell = canEdit
          ? '<select class="filter-select" style="padding:4px 8px;font-size:11px;font-weight:600;width:170px;border-radius:6px;cursor:pointer;" onchange="window.cambiarRolDirecto(' + e.id + ', this.value, \'' + e.nombre.replace(/'/g,"&#39;") + '\', \'' + e.rol + '\')">' +
              '<option value="operador"' + (e.rol==='operador'?' selected':'') + '>Operador de Campo</option>' +
              '<option value="supervisor"' + (e.rol==='supervisor'?' selected':'') + '>Supervisor de Campo</option>' +
              '<option value="visor"' + (e.rol==='visor'?' selected':'') + '>Supervisor Web</option>' +
              (e.rol==='gerente' ? '<option value="gerente" selected>Gerente de Área</option>' : '') +
              (e.rol==='admin'   ? '<option value="admin" selected>Administrador</option>' : '') +
            '</select>'
          : '<span class="badge badge-gray" style="font-size:11px;font-weight:600;">' + rolLabel + '</span>';
        var fecha = e.createdAt ? new Date(e.createdAt).toLocaleDateString() : '-';
        return '<tr>' +
          '<td><div style="display:flex;align-items:center;gap:10px;">' +
            '<div class="avatar" style="width:24px;height:24px;font-size:10px;">' + e.nombre.charAt(0) + '</div>' +
            '<a href="#" onclick="verReportesUsuario(' + e.id + ', \'' + e.nombre.replace(/'/g,"&#39;") + '\')" style="color:var(--blue);text-decoration:none;font-weight:600;">' + e.nombre + '</a>' +
          '</div></td>' +
          '<td><span class="badge badge-blue" style="text-transform:capitalize;">' + (e.gerencia||'-') + '</span></td>' +
          '<td>' + rolCell + '</td>' +
          '<td><code>' + e.username + '</code></td>' +
          '<td><div style="display:flex;align-items:center;gap:6px;"><span style="font-weight:700;color:' + (e.reportesHoy>0?'var(--green)':'var(--text-dim)') + '">' + (e.reportesHoy||0) + '</span><span style="font-size:10px;color:var(--text-muted)">reportes</span></div></td>' +
          '<td>' + fecha + '</td>' +
          '<td><div style="display:flex;gap:6px;">' +
            '<button class="btn btn-ghost" style="color:var(--cyan);padding:4px 8px;font-size:10px;font-weight:bold;" onclick="window.abrirModalSesiones(\'' + e.username + '\')">Ver Accesos</button>' +
            (canEdit ? '<button class="btn btn-ghost" style="color:var(--yellow);padding:4px 8px;font-size:10px;font-weight:600;" onclick="window.editarUsuarioEquipo(' + e.id + ',\'' + e.nombre.replace(/'/g,"&#39;") + '\',\'' + e.username + '\')">Editar</button>' +
              '<button class="btn btn-ghost" style="color:var(--blue);padding:4px 8px;font-size:10px;" onclick="resetearClaveEquipo(' + e.id + ',\'' + e.nombre.replace(/'/g,"&#39;") + '\')">Resetear Clave</button>' +
              '<button class="btn btn-ghost" style="color:var(--red);padding:4px 8px;font-size:10px;" onclick="confirmarEliminarEquipo(' + e.id + ',\'' + e.nombre.replace(/'/g,"&#39;") + '\')">Eliminar</button>' : '') +
          '</div></td>' +
        '</tr>';
      }).join('');
      return '<table class="data-table"><thead><tr>' +
        '<th>Nombre Completo</th><th>Gerencia / Área</th><th>Rol</th><th>Usuario</th><th>Reportes Hoy</th><th>Fecha Registro</th><th>Acciones</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    Object.defineProperty(window, 'renderEquipoList', {
      configurable: true, enumerable: true,
      get: function() { return _renderEquipoFn; },
      set: function(fn) {
        _renderEquipoFn = async function() {
          await fn.apply(this, arguments);
          var user = _getUser();
          if (!user || !user.gerencia || user.gerencia === 'all' || user.gerencia === 'municipal') return;
          // Solo actuar cuando el gerente tiene sub-áreas dinámicas en BD
          var subAreas = (_gerencias || []).filter(function(g) {
            return g.esSubArea && g.parentClave === user.gerencia;
          });
          if (subAreas.length === 0) return;

          // Re-fetch personal (el servidor ya filtra por gerencia + sub-áreas)
          var token = localStorage.getItem('sgti_token');
          try {
            var resp = await fetch('/api/equipo/personal', {
              headers: { 'Authorization': 'Bearer ' + token },
              credentials: 'include'
            });
            if (!resp.ok) return;
            _personalCache = await resp.json();
          } catch(e) { return; }

          // Corregir el dropdown de sub-áreas (compiled tiene opciones hardcodeadas)
          var filtro = document.getElementById('eq-filtro-subarea');
          if (filtro) {
            filtro.style.display = 'block';
            filtro.innerHTML = '<option value="todos">Todas las sub-áreas</option>' +
              subAreas.map(function(g) {
                return '<option value="' + g.clave + '">' + g.nombre + '</option>';
              }).join('');
            filtro.value = 'todos';
          }

          // Sobreescribir filtrarEquipo para usar nuestros datos correctos
          window.filtrarEquipo = function() {
            var container = document.getElementById('equipo-lista-container');
            var badge     = document.getElementById('equipo-count-badge');
            var search    = (document.getElementById('eq-search')?.value || '').toLowerCase();
            var subfilter = (document.getElementById('eq-filtro-subarea')?.value || 'todos');
            if (!container || !_personalCache) return;
            var filtered = _personalCache.filter(function(u) {
              return (!search || u.nombre.toLowerCase().includes(search)) &&
                     (subfilter === 'todos' || u.gerencia === subfilter);
            });
            if (badge) badge.textContent = filtered.length + ' Usuarios Registrados';
            container.innerHTML = _buildEquipoTable(filtered, user.rol);
          };

          window.filtrarEquipo();
        };
      }
    });
    // ────────────────────────────────────────────────────────────────────────────

    // Interceptor persistente para initDynamicGerencias:
    // pre-carga gerencias ANTES de llamar la función original, garantizando que
    // _gerencias esté lista cuando el router llame a switchWspGroup justo después.
    var _initFn = null;
    Object.defineProperty(window, 'initDynamicGerencias', {
      configurable: true, enumerable: true,
      get: function() { return _initFn; },
      set: function(fn) {
        _initFn = async function() {
          await _fetchGerencias();
          var result = await fn.apply(this, arguments);
          setTimeout(_fixToggle, 100);
          return result;
        };
      }
    });

    // Interceptor persistente para switchWspGroup:
    // redirige al gerente a la primera sub-área cuando se le pasa su gerencia padre.
    // Al ser un accessor permanente, funciona incluso en la primera llamada del módulo.
    var _switchImpl = null;
    Object.defineProperty(window, 'switchWspGroup', {
      configurable: true, enumerable: true,
      get: function() { return _switchImpl; },
      set: function(fn) {
        _switchImpl = function(clave) {
          var user = _getUser();
          if (user.gerencia && user.gerencia !== 'all' && user.gerencia !== 'municipal'
              && clave === user.gerencia && _gerencias) {
            var subs = _gerencias.filter(function(g) {
              return g.esSubArea && g.parentClave === clave;
            });
            if (subs.length > 0) clave = subs[0].clave;
          }
          return fn.call(this, clave);
        };
      }
    });

    // Parchear router.navigate una vez disponible (cubre clics del usuario)
    function _patchRouter() {
      if (!window.router || !window.router.navigate) {
        setTimeout(_patchRouter, 150);
        return;
      }
      if (window.router._sgtiPatched) return;
      window.router._sgtiPatched = true;

      var _origNav = window.router.navigate.bind(window.router);
      window.router.navigate = function(path) {
        if (!path.startsWith('/dashboard/incidencias/')) return _origNav(path);
        var user = _getUser();
        if (!user.gerencia || user.gerencia === 'all' || user.gerencia === 'municipal') return _origNav(path);
        var clave = path.substring('/dashboard/incidencias/'.length);
        var g = (_gerencias || []).find(function(g) { return g.clave === clave; });
        if (g && g.esSubArea && g.parentClave === user.gerencia) {
          window.history.pushState({}, '', path);
          if (window.showView) window.showView('whatsapp');
          setTimeout(function() {
            if (window.switchWspGroup) window.switchWspGroup(clave);
            if (window.switchWspTab) window.switchWspTab('feed');
          }, 50);
          return;
        }
        return _origNav(path);
      };

      var cont = document.getElementById('sidebar-gerencias-container');
      if (cont) new MutationObserver(_fixToggle).observe(cont, {childList: true});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', _patchRouter);
    } else {
      _patchRouter();
    }
  })();
  </script>
