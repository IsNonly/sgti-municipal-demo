  <script>
  (function() {
    // Mantener ?tenant= siempre visible en la URL al navegar dentro del SPA
    function _addTenantToUrl(url) {
      if (!url) return url;
      const tenant = localStorage.getItem('sgti_tenant');
      if (!tenant) return url;
      if (url.includes('tenant=')) return url;
      try {
        const u = localStorage.getItem('sgti_user');
        const userObj = u ? JSON.parse(u) : null;
        if (userObj && (userObj.rol === 'superadmin' || userObj.role === 'superadmin')) return url;
      } catch(e) {}
      return url + (url.includes('?') ? '&' : '?') + 'tenant=' + encodeURIComponent(tenant);
    }
    const _replaceState = history.replaceState.bind(history);
    const _pushState    = history.pushState.bind(history);
    history.replaceState = function(s, t, url) { return _replaceState(s, t, _addTenantToUrl(url)); };
    history.pushState    = function(s, t, url) { return _pushState(s,    t, _addTenantToUrl(url)); };
  })();
  </script>

  <script>
  (function() {
    // Estado global de fechas — inicializa siempre en hoy
    const todayInit = new Date().toLocaleDateString('en-CA');
    window._sgtiDateFilter = { from: todayInit, to: todayInit };

    const origFetch = window.fetch;
    window.fetch = function(url, options) {
      if (typeof url === 'string' &&
          (url.includes('/whatsapp/stats') || url.includes('/whatsapp/reportes'))) {
        try {
          const u = new URL(url, window.location.origin);
          // Solo inyectar si el caller no pasó sus propias fechas
          if (!u.searchParams.has('from') || u.searchParams.get('from') === '') {
            u.searchParams.set('from', window._sgtiDateFilter.from);
            u.searchParams.set('to',   window._sgtiDateFilter.to);
            url = u.toString();
          }
        } catch(e) {}
      }
      return origFetch.call(this, url, options);
    };

    // Inyectar barra de fechas cuando el SPA renderice la vista overview
    const observer = new MutationObserver(() => {
      const overviewView = document.getElementById('view-overview');
      if (!overviewView || document.getElementById('overview-date-bar')) return;

      const today = new Date().toLocaleDateString('en-CA');
      const bar = document.createElement('div');
      bar.id = 'overview-date-bar';
      bar.innerHTML = `
        <label>Período:</label>
        <input type="date" id="ov-from" value="${today}" max="${today}">
        <span style="color:var(--text-muted,#888);font-size:12px;">→</span>
        <input type="date" id="ov-to"   value="${today}" max="${today}">
        <button onclick="window.recargarOverviewStats()">Aplicar</button>
        <span id="overview-periodo-label">Mostrando: hoy</span>
      `;
      overviewView.insertBefore(bar, overviewView.firstChild);
      bar.style.display = 'flex';
    });
    observer.observe(document.body, { childList: true, subtree: true });

    window.recargarOverviewStats = function() {
      const fromEl = document.getElementById('ov-from');
      const toEl   = document.getElementById('ov-to');
      const label  = document.getElementById('overview-periodo-label');
      if (!fromEl || !toEl) return;

      const today = new Date().toLocaleDateString('en-CA');
      const from = fromEl.value, to = toEl.value;

      // Actualizar estado global para que todas las vistas usen el mismo rango
      window._sgtiDateFilter = { from, to };

      if (label) {
        label.textContent = (from === today && to === today) ? 'Mostrando: hoy'
          : from === to ? `Mostrando: ${from}` : `Mostrando: ${from} → ${to}`;
      }

      if (window.showView) window.showView('overview');
    };

    // ── Caché local de provincia por nombre de distrito ──────────────────────────
    // Poblado en _districtSelect; usado por _fillTenantLogos antes de que BD responda.
    window._provByNombre = new Map();

    // Caché de tenants (poblado al interceptar renderTenantsList)
    let _cachedTenants = [];

    // ── Superadmin Analytics + auto-logo de columna ───────────────────────────
    let _origRenderTenants, _saDebounce;
    Object.defineProperty(window, 'renderTenantsList', {
      configurable: true,
      get() { return _origRenderTenants; },
      set(fn) {
        _origRenderTenants = async function(...args) {
          const r = await fn.apply(this, args);
          // Capturar la lista actual de tenants desde la API (para nombreProvincia)
          try {
            const tk = localStorage.getItem('sgti_token') || '';
            const res = await fetch('/api/superadmin/tenants', { headers: { Authorization: `Bearer ${tk}` } });
            if (res.ok) _cachedTenants = await res.json();
          } catch(e) {}
          clearTimeout(_saDebounce);
          _saDebounce = setTimeout(() => window._loadSaAnalytics?.(), 400);
          setTimeout(() => window._fillTenantLogos?.(), 200);
          return r;
        };
      }
    });

    // Rellena la columna logo para tenants sin logoUrl guardado
    window._fillTenantLogos = async function() {
      const tbody = document.getElementById('tenants-table-body');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      for (const row of rows) {
        const logoCell = row.cells[1];
        if (!logoCell || logoCell.querySelector('img')) continue;
        const nameCell = row.cells[2];
        if (!nameCell) continue;
        const nombre = (nameCell.getAttribute('title') || nameCell.textContent).trim();
        const tenant = _cachedTenants.find(t => (t.nombreDistrito || t.nombre) === nombre);
        const prov   = tenant?.nombreProvincia || window._provByNombre?.get(nombre) || '';
        try {
          const params = new URLSearchParams({ dist: nombre, prov });
          const res = await fetch(`/api/superadmin/escudo-lookup?${params}`);
          const d   = await res.json();
          if (d.url) {
            logoCell.innerHTML = `<img src="${d.url}" style="height:30px;width:46px;object-fit:contain;border-radius:4px;">`;
          }
        } catch(e) {}
      }
    };

    window._saCharts = {};

    window._loadSaAnalytics = async function() {
      const view = document.getElementById('view-superadmin');
      if (!view) return;

      // Inyectar panel si no existe
      if (!document.getElementById('sa-analytics-panel')) {
        const panel = document.createElement('div');
        panel.id = 'sa-analytics-panel';
        panel.className = 'sa-panel';
        panel.innerHTML = `
          <div class="sa-panel-header">
            <div class="sa-panel-icon">🏛</div>
            <div>
              <div style="font-size:15px;font-weight:700">Red Municipal SaaS</div>
              <div style="font-size:11px;color:var(--text-muted);font-weight:400;margin-top:1px">Panel de analíticas en tiempo real</div>
            </div>
            <button id="sa-refresh-btn" onclick="window._loadSaAnalytics()" title="Actualizar">↺ Actualizar</button>
          </div>
          <div id="sa-kpis"></div>
          <div id="sa-tenants-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px"></div>
        `;
        view.insertBefore(panel, view.firstChild);
      }

      // Loading state
      const kpisEl = document.getElementById('sa-kpis');
      if (kpisEl) kpisEl.innerHTML = '<span style="color:var(--text-muted);font-size:13px">Cargando...</span>';

      try {
        const token = localStorage.getItem('sgti_token');
        const tnt   = localStorage.getItem('sgti_tenant');
        const url   = '/api/superadmin/analytics' + (tnt ? `?tenant=${tnt}` : '');
        const resp  = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const data  = await resp.json();
        if (!data.tenants) throw new Error(data.error || 'Sin datos');
        window._renderSaAnalytics(data);
      } catch (e) {
        const kpis = document.getElementById('sa-kpis');
        if (kpis) kpis.innerHTML = `<span style="color:var(--red)">Error cargando analíticas: ${e.message}</span>`;
      }
    };

    window._renderSaAnalytics = function(data) {
      const tenants = data.tenants || [];
      const activos = tenants.filter(t => t.estado === 'activo');
      const ChartJS = window.Chart;

      // ── Barra resumen de red ──
      const totalR = tenants.reduce((s, t) => s + (t.totalReportes || 0), 0);
      const totalH = tenants.reduce((s, t) => s + (t.reportesHoy  || 0), 0);
      const totalM = tenants.reduce((s, t) => s + (t.reportesMes  || 0), 0);
      const totalU = tenants.reduce((s, t) => s + (t.usuarios      || 0), 0);
      const S = {
        strip:  'display:flex;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden',
        chip:   'flex:1;text-align:center;padding:14px 8px;border-right:1px solid var(--border)',
        chipL:  'flex:1;text-align:center;padding:14px 8px',
        val:    'display:block;font-size:22px;font-weight:800;line-height:1',
        lbl:    'display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-top:5px',
        sep:    'display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)',
        sepLine:'display:block;flex:1;height:1px;background:var(--border)',
      };
      const chip = (val, lbl, color, last) =>
        `<div style="${last ? S.chipL : S.chip}">
           <span style="${S.val};color:${color||'var(--text)'}">${val}</span>
           <span style="${S.lbl}">${lbl}</span>
         </div>`;
      const kpisEl = document.getElementById('sa-kpis');
      if (kpisEl) kpisEl.innerHTML = `
        <div style="${S.strip}">
          ${chip(tenants.length,               'Municipios',   'var(--blue)')}
          ${chip(activos.length,               'Activos',      '#22c55e')}
          ${chip(tenants.length-activos.length,'Suspendidos',  '#ef4444')}
          ${chip(totalH.toLocaleString(),      'Hoy',          '#f59e0b')}
          ${chip(totalM.toLocaleString(),      'Este Mes',     '')}
          ${chip(totalR.toLocaleString(),      'Total',        '')}
          ${chip(totalU.toLocaleString(),      'Usuarios',     '',  true)}
        </div>
        <div style="${S.sep}">
          Municipios — ${tenants.length}
          <span style="${S.sepLine}"></span>
        </div>
      `;

      // ── Destruir charts previos ──
      Object.keys(window._saCharts).forEach(k => {
        if (k.startsWith('sa-te-')) { window._saCharts[k].destroy(); delete window._saCharts[k]; }
      });

      const grid = document.getElementById('sa-tenants-grid');
      if (!grid) return;

      const isDark    = !document.documentElement.classList.contains('light-mode');
      const textColor = isDark ? '#94a3b8' : '#334155';
      const eColors   = { nuevo: '#f87171', en_proceso: '#fbbf24', atendido: '#34d399' };
      const eLabels   = { nuevo: 'Nuevo', en_proceso: 'En proceso', atendido: 'Atendido' };
      const ACCENT    = ['#4f8ff7','#34d399','#fbbf24','#a78bfa','#22d3ee','#fb923c','#f472b6'];
      const ahora     = new Date();

      const sorted = [...tenants].sort((a, b) => {
        if (a.estado === b.estado) return b.reportesHoy - a.reportesHoy;
        return a.estado === 'activo' ? -1 : 1;
      });

      grid.innerHTML = sorted.map((t, i) => {
        const activo = t.estado === 'activo';
        const last   = t.ultimaActividad ? new Date(t.ultimaActividad) : null;
        const diffH  = last ? Math.round((ahora - last) / 36e5) : null;
        const actLbl = !last ? 'Sin actividad'
                     : diffH < 1  ? 'Hace menos de 1h'
                     : diffH < 24 ? `Hace ${diffH}h`
                     : `Hace ${Math.round(diffH / 24)} días`;
        const actDot = !last ? '#94a3b8' : diffH < 24 ? '#22c55e' : diffH < 168 ? '#f59e0b' : '#ef4444';
        const accent = ACCENT[i % ACCENT.length];
        const initials = (t.nombre || t.subdominio).split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
        const hasChart = activo && !t.error && (t.porEstado||[]).length > 0;
        const badgeStyle = activo
          ? 'background:#22c55e18;color:#22c55e;border:1px solid #22c55e30'
          : 'background:#ef444418;color:#ef4444;border:1px solid #ef444430';

        const statBox = (val, lbl, color) =>
          `<div style="border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center;flex:1">
             <span style="display:block;font-size:18px;font-weight:800;line-height:1;color:${color||'var(--text)'}">${val}</span>
             <span style="display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-top:4px">${lbl}</span>
           </div>`;

        return `
        <div class="card" style="padding:16px;border-top:3px solid ${accent};${!activo ? 'opacity:.65' : ''}">

          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px">
            <div style="width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,${accent},${accent}77)">${initials}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700;line-height:1.3;color:var(--text)">${t.nombre}</div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:2px">@${t.subdominio}</div>
            </div>
            <span style="flex-shrink:0;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;${badgeStyle}">${activo ? '● Activo' : '● Suspendido'}</span>
          </div>

          ${t.error ? `<div style="background:#ef444412;border:1px solid #ef444428;border-radius:8px;padding:7px 10px;font-size:11px;color:#ef4444;margin-bottom:12px">⚠ Base de datos no disponible</div>` : ''}

          <div style="display:flex;gap:8px;margin-bottom:14px">
            ${statBox((t.reportesHoy||0).toLocaleString(), 'Hoy', accent)}
            ${statBox((t.reportesMes||0).toLocaleString(), 'Este mes', '')}
            ${statBox((t.totalReportes||0).toLocaleString(), 'Total', '')}
          </div>

          ${hasChart ? `
          <div style="margin-bottom:14px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:8px">Estado de reportes</div>
            <div style="position:relative;height:120px"><canvas id="sa-te-${t.subdominio}"></canvas></div>
          </div>` : ''}

          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-muted);padding-top:12px;border-top:1px solid var(--border)">
            <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${actDot};margin-right:5px;vertical-align:middle"></span>${actLbl}</span>
            <span>👤 ${(t.usuarios||0).toLocaleString()} usuarios</span>
          </div>

        </div>`;
      }).join('');

      // ── Doughnut por municipio ──
      if (!ChartJS) return;
      sorted.forEach(t => {
        if (t.estado !== 'activo' || t.error || !(t.porEstado||[]).length) return;
        const canvasId = `sa-te-${t.subdominio}`;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        if (window._saCharts[canvasId]) window._saCharts[canvasId].destroy();
        const estados = t.porEstado;
        window._saCharts[canvasId] = new ChartJS(canvas, {
          type: 'doughnut',
          data: {
            labels: estados.map(e => eLabels[e.estado] || e.estado),
            datasets: [{
              data: estados.map(e => e.total),
              backgroundColor: estados.map(e => eColors[e.estado] || '#a78bfa'),
              borderWidth: 0, hoverOffset: 4,
            }]
          },
          options: {
            animation: false,
            responsive: true, maintainAspectRatio: false, cutout: '65%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: textColor, font: { size: 10, family: 'Inter,sans-serif' }, padding: 10, boxWidth: 10 }
              },
              tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toLocaleString()}` } }
            }
          }
        });
      });
    };

    // Interceptar window.applyFilters cuando el bundle lo asigne.
    // Así al usar el filtro Desde/Hasta en cualquier vista, las KPI cards también se actualizan.
    let _origApplyFilters;
    Object.defineProperty(window, 'applyFilters', {
      configurable: true,
      get() { return _origApplyFilters; },
      set(fn) {
        _origApplyFilters = function(...args) {
          // Sincronizar _sgtiDateFilter con los inputs del formulario
          const fromEl = document.getElementById('filter-from');
          const toEl   = document.getElementById('filter-to');
          if (fromEl?.value && toEl?.value) {
            window._sgtiDateFilter = { from: fromEl.value, to: toEl.value };
          }
          const result = fn.apply(this, args);
          // Recargar KPIs de la vista activa después de que refreshReportes termine
          setTimeout(() => {
            const activeEl = document.querySelector('.view.active');
            const viewId   = activeEl?.id?.replace('view-', '');
            if (viewId && ['seguridad', 'fiscalizacion_transporte'].includes(viewId)) {
              window.showView?.(viewId);
            }
          }, 350);
          return result;
        };
      }
    });
  })();
  </script>

  // ── Eliminar municipio desde superadmin ──────────────────────────────────────

  window.eliminarTenant = function(tenantId, tenantNombre) {
    _ensureModalEliminar();
    const modal  = document.getElementById('modal-eliminar-tenant');
    const msg    = document.getElementById('modal-eliminar-msg');
    const status = document.getElementById('modal-eliminar-status');
    const btn    = document.getElementById('modal-eliminar-confirm-btn');
    if (msg) msg.textContent = `¿Eliminar "${tenantNombre}" con todos sus usuarios, reportes y datos? Se borrarán también los archivos del servidor.`;
    if (status) status.textContent = '';
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Sí, eliminar todo';
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Eliminando...';
        if (status) status.textContent = '';
        try {
          const token = localStorage.getItem('sgti_token') || '';
          const resp = await fetch(`/api/superadmin/tenants/${tenantId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await resp.json();
          if (!resp.ok) {
            if (status) { status.style.color = '#dc2626'; status.textContent = data.error || 'Error al eliminar.'; }
            btn.disabled = false; btn.textContent = 'Sí, eliminar todo';
            return;
          }
          if (status) { status.style.color = '#16a34a'; status.textContent = '✓ ' + data.mensaje; }
          setTimeout(() => {
            modal.style.display = 'none';
            window.renderTenantsList?.();
            window._loadSaAnalytics?.();
          }, 1200);
        } catch(e) {
          if (status) { status.style.color = '#dc2626'; status.textContent = 'Error de conexión.'; }
          btn.disabled = false; btn.textContent = 'Sí, eliminar todo';
        }
      };
    }
    modal.style.display = 'flex';
  };

  // MutationObserver: reorganiza acciones de cada fila de tenants e inyecta Eliminar
  (function() {
    const BTN = 'padding:6px 10px;font-size:11px;font-weight:600;border-radius:7px;cursor:pointer;border:none;display:flex;align-items:center;gap:5px;justify-content:center;width:100%;white-space:nowrap';

    function estilizarAcciones(container) {
      if (container.dataset.sgtiStyled) return;
      container.dataset.sgtiStyled = '1';

      // Recoger botones existentes del bundle
      const btns = [...container.querySelectorAll('button')];
      const editBtn   = btns.find(b => b.textContent.trim() === 'Editar');
      const statusBtn = btns.find(b => ['Suspender','Activar'].includes(b.textContent.trim()));
      const entrarBtn = btns.find(b => b.textContent.trim() === 'Entrar');
      const usersBtn  = btns.find(b => b.textContent.trim() === 'Usuarios');
      if (!editBtn) return;

      // Obtener id y nombre del tenant desde editarTenant
      const m = editBtn.getAttribute('onclick')?.match(/editarTenant\('([^']+)',\s*'([^']*)'/);
      if (!m) return;
      const [, tenantId, tenantNombre] = m;

      // Limpiar el contenedor
      container.innerHTML = '';
      container.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:200px';

      // Botón Editar
      const bEdit = document.createElement('button');
      bEdit.textContent = 'Editar';
      bEdit.style.cssText = BTN + ';background:#e0f2fe;color:#0369a1';
      bEdit.onclick = editBtn.onclick;
      bEdit.setAttribute('onclick', editBtn.getAttribute('onclick'));

      // Botón Suspender/Activar
      const isSuspended = statusBtn?.textContent.trim() === 'Activar';
      const bStatus = document.createElement('button');
      bStatus.textContent = isSuspended ? 'Activar' : 'Suspender';
      bStatus.style.cssText = BTN + ';background:' + (isSuspended ? '#dcfce7;color:#15803d' : '#fee2e2;color:#b91c1c');
      bStatus.setAttribute('onclick', statusBtn?.getAttribute('onclick') || '');

      // Botón Entrar (solo si existe)
      const bEntrar = document.createElement('button');
      if (entrarBtn) {
        bEntrar.textContent = 'Entrar';
        bEntrar.style.cssText = BTN + ';background:#ede9fe;color:#6d28d9';
        bEntrar.setAttribute('onclick', entrarBtn.getAttribute('onclick'));
      }

      // Botón Usuarios
      const bUsers = document.createElement('button');
      bUsers.textContent = 'Usuarios';
      bUsers.style.cssText = BTN + ';background:#f0fdf4;color:#166534';
      bUsers.setAttribute('onclick', usersBtn?.getAttribute('onclick') || '');

      // Botón Eliminar (ancho completo)
      const bDel = document.createElement('button');
      bDel.textContent = 'Eliminar';
      bDel.style.cssText = BTN + ';background:#fff1f2;color:#be123c;border:1px solid #fecdd3;grid-column:1/-1';
      bDel.onclick = () => window.eliminarTenant(tenantId, tenantNombre);

      container.appendChild(bEdit);
      container.appendChild(bStatus);
      if (entrarBtn) {
        container.appendChild(bEntrar);
        container.appendChild(bUsers);
      } else {
        bUsers.style.cssText = BTN + ';background:#f0fdf4;color:#166534;grid-column:1/-1';
        container.appendChild(bUsers);
      }
      container.appendChild(bDel);
    }

    const obs = new MutationObserver(() => {
      const view = document.getElementById('view-superadmin');
      if (!view) return;
      view.querySelectorAll('button[onclick*="editarTenant"]').forEach(editBtn => {
        const container = editBtn.closest('div[style*="flex"]') || editBtn.parentElement;
        if (container) estilizarAcciones(container);
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  })();
