  // ── PDF Mejorado: gráficos, comparativa, firma ───────────────────────────────
  (function() {
    let _origGenerarPDF;
    let _pdfEnhData = null;

    // Polyfill roundRect por si el browser no lo tiene
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2*r) r = w/2; if (h < 2*r) r = h/2;
        this.beginPath();
        this.moveTo(x+r, y);
        this.arcTo(x+w, y, x+w, y+h, r);
        this.arcTo(x+w, y+h, x, y+h, r);
        this.arcTo(x, y+h, x, y, r);
        this.arcTo(x, y, x+w, y, r);
        this.closePath();
        return this;
      };
    }

    // ── Canvas: gráfico de barras horizontales ─────────────────────────────
    function _barChart(items, cW, cH) {
      const canvas = document.createElement('canvas');
      canvas.width = cW; canvas.height = cH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cW, cH);

      const top = items.slice(0, 10);
      const maxV = Math.max(...top.map(i => i.value), 1);
      const labelW = 130, padR = 55, barH = Math.min(22, (cH - 30) / top.length - 5);

      top.forEach((item, i) => {
        const y = 15 + i * (barH + 6);
        const bW = ((item.value / maxV) * (cW - labelW - padR));

        ctx.fillStyle = '#334155';
        ctx.font = '11px Arial';
        ctx.textAlign = 'right';
        const lbl = item.label.length > 17 ? item.label.slice(0, 16) + '…' : item.label;
        ctx.fillText(lbl, labelW - 6, y + barH * 0.7);

        ctx.fillStyle = '#f1f5f9';
        ctx.roundRect(labelW, y, cW - labelW - padR, barH, 3);
        ctx.fill();

        ctx.fillStyle = item.color || '#4F8FF7';
        ctx.roundRect(labelW, y, Math.max(bW, 4), barH, 3);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(item.value, labelW + bW + 5, y + barH * 0.7);
      });
      return canvas.toDataURL('image/png');
    }

    // ── Canvas: gráfico de línea de tendencia ──────────────────────────────
    function _lineChart(points, cW, cH) {
      const canvas = document.createElement('canvas');
      canvas.width = cW; canvas.height = cH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cW, cH);
      if (!points.length) return canvas.toDataURL('image/png');

      const padL=50, padR=20, padT=18, padB=28;
      const chartW = cW-padL-padR, chartH = cH-padT-padB;
      const maxV = Math.max(...points.map(p=>p.count), 1);

      // Grid
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
      [0,1,2,3,4].forEach(g => {
        const y = padT + (chartH/4)*g;
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
        ctx.fillStyle='#94a3b8'; ctx.font='9px Arial'; ctx.textAlign='right';
        ctx.fillText(Math.round(maxV*(1-g/4)), padL-5, y+3);
      });

      // X labels
      const skip = Math.ceil(points.length/8);
      points.forEach((p,i) => {
        if (i%skip===0) {
          const x = padL + (i/Math.max(points.length-1,1))*chartW;
          ctx.fillStyle='#94a3b8'; ctx.font='8px Arial'; ctx.textAlign='center';
          ctx.fillText(p.date.slice(5), x, padT+chartH+16);
        }
      });

      const px = (i) => padL + (i/Math.max(points.length-1,1))*chartW;
      const py = (v) => padT + chartH - (v/maxV)*chartH;

      // Area
      ctx.beginPath();
      ctx.moveTo(padL, padT+chartH);
      points.forEach((p,i) => ctx.lineTo(px(i), py(p.count)));
      ctx.lineTo(padL+chartW, padT+chartH);
      ctx.closePath();
      ctx.fillStyle='rgba(79,143,247,0.13)'; ctx.fill();

      // Line
      ctx.beginPath(); ctx.strokeStyle='#4F8FF7'; ctx.lineWidth=2.5; ctx.lineJoin='round';
      points.forEach((p,i) => i===0 ? ctx.moveTo(px(i),py(p.count)) : ctx.lineTo(px(i),py(p.count)));
      ctx.stroke();

      // Dots en picos
      points.forEach((p,i) => {
        if (p.count === maxV || i===0 || i===points.length-1) {
          ctx.beginPath(); ctx.arc(px(i),py(p.count),4,0,Math.PI*2);
          ctx.fillStyle='#4F8FF7'; ctx.fill();
          ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
        }
      });
      return canvas.toDataURL('image/png');
    }

    // ── Fetch datos para mejoras del PDF ───────────────────────────────────
    async function _fetchEnhData(tipo) {
      const token  = localStorage.getItem('sgti_token') || '';
      const tenant = localStorage.getItem('sgti_tenant') || '';
      const sector = document.getElementById('filter-sector')?.value || 'all';
      const area   = document.getElementById('filter-area')?.value   || 'all';
      const from   = document.getElementById('filter-from')?.value   || '';
      const to     = document.getElementById('filter-to')?.value     || '';

      const mkParams = (f, t) => {
        const p = new URLSearchParams({ limit: 5000 });
        if (f) p.append('from', f);
        if (t) p.append('to', t);
        if (sector !== 'all') p.append('sector', sector);
        const grp = (area !== 'all') ? area : (tipo !== 'general' && tipo !== 'ejecutivo' ? tipo : '');
        if (grp) p.append('grupo', grp);
        if (tenant) p.append('tenant', tenant);
        return p;
      };

      let prevFrom='', prevTo='';
      if (from && to) {
        const d1=new Date(from), d2=new Date(to);
        const days = Math.round((d2-d1)/86400000);
        const pTo = new Date(d1); pTo.setDate(pTo.getDate()-1);
        const pFrom = new Date(pTo); pFrom.setDate(pFrom.getDate()-days);
        prevFrom = pFrom.toISOString().slice(0,10);
        prevTo   = pTo.toISOString().slice(0,10);
      }

      const hdrs = { Authorization: `Bearer ${token}` };
      let curr=[], prev=[];
      try {
        const r = await fetch(`/api/whatsapp/reportes?${mkParams(from,to)}`, {headers:hdrs});
        const d = await r.json();
        curr = d.reportes || (Array.isArray(d) ? d : []);
      } catch(e) {}
      if (prevFrom && prevTo) {
        try {
          const r = await fetch(`/api/whatsapp/reportes?${mkParams(prevFrom,prevTo)}`, {headers:hdrs});
          const d = await r.json();
          prev = d.reportes || (Array.isArray(d) ? d : []);
        } catch(e) {}
      }

      // Procesar sectores
      const sCounts = {};
      curr.forEach(r => {
        if (r.sector && r.sector !== 'Fuera de Jurisdicción' && r.sector !== 'Sin sector')
          sCounts[r.sector] = (sCounts[r.sector]||0)+1;
      });
      const sectorItems = Object.entries(sCounts)
        .sort((a,b)=>b[1]-a[1]).slice(0,10)
        .map(([label,value],i)=>({label,value,color:i===0?'#ef4444':i===1?'#f59e0b':i===2?'#f97316':'#4F8FF7'}));

      // Tendencia diaria
      const daily = {};
      curr.forEach(r => { if(r.fecha){const d=r.fecha.slice(0,10); daily[d]=(daily[d]||0)+1;} });
      const trendPoints = Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,count])=>({date,count}));

      // Estado
      const estadoItems = [
        {label:'Atendidas', value:curr.filter(r=>r.estado==='atendido').length,   color:'#22c55e'},
        {label:'En Proceso',value:curr.filter(r=>r.estado==='en_proceso').length, color:'#f59e0b'},
        {label:'Pendientes',value:curr.filter(r=>r.estado==='nuevo').length,      color:'#ef4444'},
      ].filter(i=>i.value>0);

      const calcStats = d => ({
        total:     d.length,
        atendido:  d.filter(r=>r.estado==='atendido').length,
        nuevo:     d.filter(r=>r.estado==='nuevo').length,
        alta:      d.filter(r=>['Alta','alta'].includes(r.prioridad)).length,
        conGeo:    d.filter(r=>r.lat&&r.lng).length,
      });

      return { curr, prev, sectorItems, trendPoints, estadoItems,
               currStats:calcStats(curr), prevStats:prev.length?calcStats(prev):null,
               from, to, prevFrom, prevTo, tipo };
    }

    // ── Agregar páginas de mejora al doc jsPDF ─────────────────────────────
    function _addPages(doc) {
      const enh = _pdfEnhData;
      if (!enh) return;

      const pw = doc.internal.pageSize.getWidth();
      const ph = doc.internal.pageSize.getHeight();
      const BLUE = [79,143,247], DARK=[8,13,26];

      const header = (title, sub) => {
        doc.setFillColor(...DARK); doc.rect(0,0,pw,24,'F');
        doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont(undefined,'bold');
        doc.text(title, 14, 10);
        doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.setTextColor(...BLUE);
        doc.text(sub, 14, 17);
        doc.setTextColor(40,40,40);
        return 30;
      };
      const footer = () => {
        const n = doc.internal.getNumberOfPages();
        doc.setFontSize(7); doc.setTextColor(150,150,150);
        doc.text('SGTI Municipal — Sistema de Gestión Territorial de Incidencias', 14, ph-6);
        doc.text(`Pág. ${n}`, pw-14, ph-6, {align:'right'});
      };

      // ── Página: Gráfico de barras sectores ──
      if (enh.sectorItems.length > 0) {
        doc.addPage();
        let y = header('ANÁLISIS VISUAL — DISTRIBUCIÓN POR SECTORES',
                        'Incidencias por sector territorial (excluyendo Fuera de Jurisdicción)');

        const bImg = _barChart(enh.sectorItems, 620, 300);
        const bW = pw-28, bH = bW*(300/620);
        doc.addImage(bImg,'PNG',14,y,bW,bH);
        y += bH + 8;

        if (enh.estadoItems.length > 0) {
          doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.setTextColor(40,40,40);
          doc.text('Estado de Atención', 14, y); y += 5;
          const total = enh.estadoItems.reduce((s,i)=>s+i.value,0);
          const eImg = _barChart(enh.estadoItems.map(i=>({...i,label:`${i.label} — ${((i.value/total)*100).toFixed(0)}%`})), 620, 90);
          const eH = bW*(90/620);
          doc.addImage(eImg,'PNG',14,y,bW,eH);
        }
        footer();
      }

      // ── Página: Tendencia diaria ──
      if (enh.trendPoints.length > 3) {
        doc.addPage();
        let y = header('ANÁLISIS TEMPORAL — TENDENCIA DIARIA DE INCIDENCIAS',
                        'Evolución de reportes por día calendario en el período seleccionado');

        const tImg = _lineChart(enh.trendPoints, 620, 210);
        const tW = pw-28, tH = tW*(210/620);
        doc.addImage(tImg,'PNG',14,y,tW,tH);
        y += tH + 10;

        const pts = enh.trendPoints;
        const avg = (pts.reduce((s,p)=>s+p.count,0)/pts.length).toFixed(1);
        const maxDay = pts.reduce((m,p)=>p.count>m.count?p:m, pts[0]);
        const minDay = pts.reduce((m,p)=>p.count<m.count?p:m, pts[0]);

        doc.setFontSize(9.5); doc.setFont(undefined,'normal'); doc.setTextColor(70,70,70);
        [
          `• Promedio diario: ${avg} incidencias/día durante ${pts.length} días`,
          `• Día de mayor actividad: ${maxDay.date} con ${maxDay.count} reportes registrados`,
          `• Día de menor actividad: ${minDay.date} con ${minDay.count} reportes registrados`,
        ].forEach(txt => { doc.text(txt, 14, y); y += 6; });
        footer();
      }

      // ── Página: Comparativa períodos ──
      if (enh.prevStats && enh.prev.length > 0) {
        doc.addPage();
        let y = header('COMPARATIVA DE PERÍODOS — ACTUAL VS ANTERIOR',
                        `Actual: ${enh.from||'inicio'} – ${enh.to||'hoy'}  |  Anterior: ${enh.prevFrom} – ${enh.prevTo}`);

        const c=enh.currStats, p=enh.prevStats;
        const pct=(curr,prev)=>prev===0?'N/D':`${curr>prev?'+':''}${(((curr-prev)/prev)*100).toFixed(1)}%`;
        const arrow=(curr,prev,lowGood)=>{
          if(prev===0)return'—';
          const up=curr>prev;
          return (up&&!lowGood)||(!up&&lowGood)?'▼ Mejora':'▲ Aumento';
        };
        const tasa=(d)=>d.total?((d.atendido/d.total)*100).toFixed(1)+'%':'0%';

        doc.autoTable({
          startY:y,
          head:[['Indicador','Período Anterior','Período Actual','Variación','Tendencia']],
          body:[
            ['Total Incidencias',    p.total,    c.total,    pct(c.total,p.total),       arrow(c.total,p.total,true)],
            ['Atendidas',           p.atendido, c.atendido, pct(c.atendido,p.atendido),  arrow(c.atendido,p.atendido,false)],
            ['Pendientes',          p.nuevo,    c.nuevo,    pct(c.nuevo,p.nuevo),         arrow(c.nuevo,p.nuevo,true)],
            ['Prioridad Alta',      p.alta,     c.alta,     pct(c.alta,p.alta),           arrow(c.alta,p.alta,true)],
            ['Georeferenciadas',    p.conGeo,   c.conGeo,   pct(c.conGeo,p.conGeo),       arrow(c.conGeo,p.conGeo,false)],
            ['Tasa Resolución',     tasa(p),    tasa(c),    '—','—'],
          ],
          styles:{fontSize:9.5,cellPadding:4,valign:'middle'},
          headStyles:{fillColor:DARK,textColor:[255,255,255],fontStyle:'bold',fontSize:9},
          columnStyles:{
            0:{cellWidth:52,fontStyle:'bold'},
            1:{cellWidth:35,halign:'center'},
            2:{cellWidth:35,halign:'center',fontStyle:'bold',textColor:BLUE},
            3:{cellWidth:30,halign:'center'},
            4:{cellWidth:'auto',halign:'center',fontStyle:'bold'},
          },
          didParseCell(data){
            if(data.column.index===3&&data.cell.section==='body'){
              const v=String(data.cell.raw);
              if(v.startsWith('+'))data.cell.styles.textColor=[220,38,38];
              else if(v.startsWith('-'))data.cell.styles.textColor=[22,163,74];
            }
            if(data.column.index===4&&data.cell.section==='body'){
              const v=String(data.cell.raw);
              if(v.includes('Mejora'))data.cell.styles.textColor=[22,163,74];
              else if(v.includes('Aumento'))data.cell.styles.textColor=[220,38,38];
            }
          },
          margin:{left:14,right:14},
        });
        y = doc.lastAutoTable.finalY+10;
        doc.setFontSize(7.5); doc.setFont(undefined,'italic'); doc.setTextColor(110,110,110);
        doc.text('* "Mejora" en incidencias totales/pendientes/alta indica reducción (positivo). "Aumento" indica incremento (requiere atención).', 14, y);
        footer();
      }

      // ── Página: Firma y autorización ──
      doc.addPage();
      let y = header('CERTIFICACIÓN Y AUTORIZACIÓN DEL INFORME',
                      'Documento oficial generado por el Sistema de Gestión Territorial de Incidencias (SGTI Municipal)');

      const fechaStr = new Date().toLocaleDateString('es-PE',{day:'2-digit',month:'long',year:'numeric'});
      doc.setFontSize(9.5); doc.setFont(undefined,'normal'); doc.setTextColor(60,60,60);
      doc.text(`El presente informe fue generado automáticamente el día ${fechaStr}, conforme a los datos registrados en el`, 14, y, {maxWidth:pw-28});
      y += 6;
      doc.text('sistema SGTI Municipal y validados por la unidad responsable de la municipalidad.', 14, y, {maxWidth:pw-28});
      y += 16;

      // Cajas de firma
      const boxes=[
        {title:'ELABORADO POR',   sub:'Analista / Operador del Sistema'},
        {title:'REVISADO POR',    sub:'Gerente de Área / Responsable'},
        {title:'APROBADO POR',    sub:'Alcalde / Gerente Municipal'},
      ];
      const bxW=(pw-28-10)/3;
      boxes.forEach((box,i)=>{
        const x=14+i*(bxW+5);
        doc.setDrawColor(180,180,180); doc.setLineWidth(0.3);
        doc.rect(x, y, bxW, 58);

        doc.setFillColor(...BLUE); doc.rect(x, y, bxW, 11,'F');
        doc.setTextColor(255,255,255); doc.setFontSize(7.5); doc.setFont(undefined,'bold');
        doc.text(box.title, x+bxW/2, y+7.5, {align:'center'});

        doc.setTextColor(100,100,100); doc.setFontSize(7); doc.setFont(undefined,'italic');
        doc.text(box.sub, x+bxW/2, y+18, {align:'center'});

        doc.setDrawColor(160,160,160); doc.setLineWidth(0.5);
        doc.line(x+8, y+43, x+bxW-8, y+43);

        doc.setFontSize(7); doc.setTextColor(80,80,80); doc.setFont(undefined,'normal');
        doc.text('Nombre y Firma', x+bxW/2, y+49, {align:'center'});
        doc.text('Fecha: _______________', x+bxW/2, y+55, {align:'center'});
      });
      y += 68;

      // Número de documento + nota legal
      const docNum=`SGTI-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;
      doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(40,40,40);
      doc.text(`N° Documento: ${docNum}`, 14, y);
      y += 7;
      doc.setFont(undefined,'normal'); doc.setFontSize(7.5); doc.setTextColor(130,130,130);
      const legal='Este documento es de carácter oficial. Su reproducción sin autorización expresa de la Municipalidad queda prohibida. Los datos provienen del Sistema SGTI Municipal y son responsabilidad de las unidades que los registraron.';
      doc.text(doc.splitTextToSize(legal, pw-28), 14, y);

      // Línea y pie azul
      doc.setDrawColor(...BLUE); doc.setLineWidth(0.8);
      doc.line(14, ph-20, pw-14, ph-20);
      doc.setFontSize(8); doc.setFont(undefined,'bold'); doc.setTextColor(...BLUE);
      doc.text('SGTI MUNICIPAL — Sistema de Gestión Territorial de Incidencias', pw/2, ph-14, {align:'center'});
      doc.setFontSize(7); doc.setFont(undefined,'normal'); doc.setTextColor(160,160,160);
      doc.text('Para verificar la autenticidad, contacte al área de Sistemas de la Municipalidad.', pw/2, ph-9, {align:'center'});
      footer();

      _pdfEnhData = null;
    }

    // ── Parche jsPDF.prototype.save ────────────────────────────────────────
    function _patchJsPDF() {
      if (!window.jspdf?.jsPDF || window.jspdf.jsPDF._sgtiPDFPatched) return;
      const orig = window.jspdf.jsPDF.prototype.save;
      window.jspdf.jsPDF.prototype.save = function(filename, opts) {
        if (_pdfEnhData && filename && (filename.includes('Reporte_')||filename.includes('Informe_'))) {
          try { _addPages(this); } catch(e) { console.error('PDF enhancement error:', e); }
        }
        return orig.call(this, filename, opts);
      };
      window.jspdf.jsPDF._sgtiPDFPatched = true;
    }
    if (window.jspdf?.jsPDF) _patchJsPDF();
    const _jsPDFObs = new MutationObserver(()=>{
      if(window.jspdf?.jsPDF&&!window.jspdf.jsPDF._sgtiPDFPatched) _patchJsPDF();
    });
    _jsPDFObs.observe(document.head,{childList:true,subtree:true});

    // ── Interceptar window.generateReportesPdf ────────────────────────────
    Object.defineProperty(window, 'generateReportesPdf', {
      configurable: true,
      get() { return _enhanced; },
      set(fn)  { _origGenerarPDF = fn; },
    });

    async function _enhanced(tipo) {
      // Overlay de carga
      let ov = document.getElementById('sgti-pdf-ov');
      if (!ov) {
        ov = document.createElement('div');
        ov.id = 'sgti-pdf-ov';
        ov.style.cssText='position:fixed;inset:0;background:rgba(8,13,26,.75);z-index:99999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
        ov.innerHTML=`<div style="background:#fff;border-radius:16px;padding:32px 40px;text-align:center;width:300px;box-shadow:0 24px 80px rgba(0,0,0,.4)">
          <div style="font-size:36px;margin-bottom:12px">📊</div>
          <div style="font-size:15px;font-weight:700;color:#0f172a;margin-bottom:6px">Generando Informe PDF</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:16px" id="sgti-pdf-st">Preparando datos...</div>
          <div style="height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden">
            <div id="sgti-pdf-br" style="height:100%;background:#4F8FF7;width:8%;border-radius:3px;transition:width .4s ease"></div>
          </div>
        </div>`;
        document.body.appendChild(ov);
      }
      ov.style.display = 'flex';
      const setSt = (msg, pct) => {
        const el=document.getElementById('sgti-pdf-st'), br=document.getElementById('sgti-pdf-br');
        if(el) el.textContent=msg;
        if(br) br.style.width=pct+'%';
      };

      try {
        _patchJsPDF();
        setSt('Obteniendo datos del período actual…', 15);
        _pdfEnhData = await _fetchEnhData(tipo);
        setSt('Calculando comparativa con período anterior…', 40);
        await new Promise(r=>setTimeout(r,200));
        setSt('Generando informe base del sistema…', 65);
        if (_origGenerarPDF) await _origGenerarPDF.call(window, tipo);
        setSt('Añadiendo gráficos y firma…', 90);
        await new Promise(r=>setTimeout(r,300));
        setSt('¡Informe completado!', 100);
      } catch(e) {
        console.error('PDF enhancer error:', e);
        _pdfEnhData = null;
        if (_origGenerarPDF) await _origGenerarPDF.call(window, tipo);
      } finally {
        setTimeout(()=>{ ov.style.display='none'; }, 1500);
      }
    }
  })();

  </script>

  <!-- Mapa de calor crítico — aislado en su propio script para no verse afectado por errores de otros bloques -->
  <script>
  (function() {
    let _criticoLayer  = null;   // L.heatLayer con pesos críticos
    let _marcadores    = [];     // círculos individuales con popup
    let _modoActivo    = false;  // true cuando está en modo crítico

    const COLORES_PESO = {
      alto:  '#ef4444',   // peso >= 8
      medio: '#f59e0b',   // peso >= 5
      bajo:  '#3b82f6',   // peso < 5
    };

    function colorPorPeso(p) {
      return p >= 8 ? COLORES_PESO.alto : p >= 5 ? COLORES_PESO.medio : COLORES_PESO.bajo;
    }

    // Agrega la opción "Seguridad Crítica" al selector de grupo del heat map
    function _inyectarOpcionCritico() {
      const sel = document.getElementById('heat-filtro-grupo');
      if (!sel || sel.querySelector('option[value="critico"]')) return;
      const opt = document.createElement('option');
      opt.value = 'critico';
      opt.textContent = 'Seguridad Critica (ponderado)';
      sel.appendChild(opt);
    }

    // Limpia capas del modo crítico del mapa
    function _limpiarCapasCritico(map) {
      if (_criticoLayer && map) { try { map.removeLayer(_criticoLayer); } catch(e) {} _criticoLayer = null; }
      _marcadores.forEach(m => { try { map.removeLayer(m); } catch(e) {} });
      _marcadores = [];
    }

    // Helpers de tiempo
    function _diasTranscurridos(fecha) {
      if (!fecha) return 0;
      return (Date.now() - new Date(fecha).getTime()) / 86400000;
    }
    function _labelTiempo(fecha) {
      if (!fecha) return '';
      const ms = Date.now() - new Date(fecha).getTime();
      const d = Math.floor(ms / 86400000);
      const h = Math.floor((ms % 86400000) / 3600000);
      if (d >= 1) return `${d}d ${h}h`;
      if (h >= 1) return `${h}h`;
      return 'Reciente';
    }
    const _ATENDIDOS = new Set(['atendido','atendida','cerrado','cerrada']);
    function _esPendiente(p) { return !_ATENDIDOS.has((p.estado||'').toLowerCase()); }

    // Renderiza el mapa de calor crítico con pesos y marcadores de novedad
    async function _renderizarCritico(map) {
      _limpiarCapasCritico(map);
      _modoActivo = true;

      const token = localStorage.getItem('sgti_token') || '';
      const tenant = localStorage.getItem('sgti_tenant') || '';
      const url = '/api/seguridad/novedades-criticas' + (tenant ? `?tenant=${tenant}` : '');

      let data;
      try {
        const resp = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        data = await resp.json();
      } catch(e) {
        console.error('Error cargando novedades criticas:', e);
        return;
      }

      const points = data.points || [];
      if (!points.length) {
        _actualizarPanelNovedades([]);
        return;
      }

      // Capa de calor con pesos reales
      const heatData = points.map(p => [p.lat, p.lng, p.pesoNorm]);
      if (window.L && window.L.heatLayer) {
        _criticoLayer = L.heatLayer(heatData, {
          radius: 28, blur: 20, maxZoom: 17,
          gradient: { 0.2: '#3b82f6', 0.5: '#f59e0b', 0.8: '#ef4444', 1.0: '#7f1d1d' }
        });
        _criticoLayer.addTo(map);
      }

      // Marcadores individuales con indicador de tiempo transcurrido
      const topPoints = points.filter(p => p.peso >= 7).slice(0, 100);
      topPoints.forEach(p => {
        const color    = colorPorPeso(p.peso);
        const radius   = p.peso >= 9 ? 9 : p.peso >= 7 ? 7 : 5;
        const dias     = _diasTranscurridos(p.fecha);
        const pendiente = _esPendiente(p);
        const tiempoLabel = _labelTiempo(p.fecha);
        const fecha    = p.fecha ? new Date(p.fecha).toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' }) : '';

        // Borde de alerta según antigüedad pendiente
        let borderColor = '#fff', borderWeight = 1.5, dashArr = null;
        if (pendiente && dias >= 7) {
          borderColor = '#dc2626'; borderWeight = 2.5; dashArr = '5,3';
        } else if (pendiente && dias >= 3) {
          borderColor = '#f59e0b'; borderWeight = 2;
        }

        const tiempoColor = pendiente && dias >= 7 ? '#dc2626' : pendiente && dias >= 3 ? '#d97706' : '#16a34a';
        const popup = `
          <div style="min-width:210px;font-family:Inter,sans-serif">
            <div style="font-weight:700;font-size:13px;color:${color};margin-bottom:4px">${p.categoria}</div>
            <div style="font-size:12px;color:#334155;line-height:1.4;margin-bottom:6px">${p.novedad || 'Sin descripción'}</div>
            <div style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:#64748b">
              <span>Sector: <b>${p.sector}</b></span>
              ${p.ubicacion ? `<span>Ubicacion: ${p.ubicacion}</span>` : ''}
              <span>Estado: <b style="color:${p.estado==='atendido'||p.estado==='atendida'?'#16a34a':p.estado==='en_proceso'?'#d97706':'#dc2626'}">${p.estado}</b></span>
              ${fecha ? `<span>${fecha}</span>` : ''}
              ${tiempoLabel ? `<span style="margin-top:3px;padding:2px 6px;background:${tiempoColor}22;border-radius:3px;color:${tiempoColor};font-weight:700">⏱ ${tiempoLabel} transcurrido${pendiente?' · Pendiente':''}</span>` : ''}
            </div>
          </div>`;

        const opts = { radius: radius + (pendiente && dias >= 7 ? 2 : 0), fillColor: color, color: borderColor, weight: borderWeight, fillOpacity: 0.9 };
        if (dashArr) opts.dashArray = dashArr;
        const marker = L.circleMarker([p.lat, p.lng], opts).bindPopup(popup);
        marker.addTo(map);
        _marcadores.push(marker);
      });

      _actualizarPanelNovedades(points);
    }

    // Actualiza el panel lateral de novedades en el mapa de calor
    let _tabPanelActivo = 'criticas';
    function _actualizarPanelNovedades(points) {
      let panel = document.getElementById('panel-novedades-criticas');
      if (!panel) {
        const grid = document.querySelector('.heatmap-grid');
        if (!grid) return;
        const col = grid.children[1];
        if (!col) return;
        panel = document.createElement('div');
        panel.id = 'panel-novedades-criticas';
        panel.className = 'card glass';
        panel.style.cssText = 'padding:14px;display:none;flex-direction:column;gap:8px;max-height:440px';
        col.appendChild(panel);
      }

      if (!_modoActivo) { panel.style.display = 'none'; return; }

      const criticas   = points.filter(p => p.peso >= 7).slice(0, 20);
      // Más transcurridas: pendientes ordenadas por fecha ASC (más antiguas primero)
      const transcurridas = points
        .filter(p => _esPendiente(p) && p.fecha)
        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
        .slice(0, 20);

      function _renderItem(p, showTiempo) {
        const color = colorPorPeso(p.peso);
        const fecha = p.fecha ? new Date(p.fecha).toLocaleDateString('es-PE') : '';
        const dias  = _diasTranscurridos(p.fecha);
        const tLabel = _labelTiempo(p.fecha);
        const tColor = dias >= 7 ? '#dc2626' : dias >= 3 ? '#d97706' : '#16a34a';
        return `<div style="border-left:3px solid ${showTiempo ? tColor : color};padding:6px 8px;background:var(--card-hover);border-radius:4px;cursor:pointer"
                  onclick="(function(){var m=window._sgtiHeatMapInstance||window.mapHeat;m&&m.setView([${p.lat},${p.lng}],17)})()">
          ${showTiempo
            ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
                <div style="font-size:11px;font-weight:700;color:${tColor}">⏱ ${tLabel}</div>
                <div style="font-size:10px;padding:1px 5px;background:${tColor}22;border-radius:3px;color:${tColor};font-weight:700">${p.estado}</div>
               </div>`
            : `<div style="font-size:11px;font-weight:700;color:${color}">${p.categoria}</div>`
          }
          <div style="font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.3">${(p.novedad||'').substring(0,70)}${(p.novedad||'').length>70?'…':''}</div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:3px">${p.sector} · ${fecha}</div>
        </div>`;
      }

      panel.style.display = 'flex';
      panel.innerHTML = `
        <div style="display:flex;gap:4px;margin-bottom:4px">
          <button id="tab-criticas" onclick="window._sgtiTabPanel('criticas')"
            style="flex:1;padding:5px 0;font-size:11px;font-weight:700;border:none;border-radius:5px;cursor:pointer;
                   background:${_tabPanelActivo==='criticas'?'#ef4444':'var(--card-hover)'};
                   color:${_tabPanelActivo==='criticas'?'#fff':'var(--text-muted)'}">
            Criticas (${criticas.length})
          </button>
          <button id="tab-transcurridas" onclick="window._sgtiTabPanel('transcurridas')"
            style="flex:1;padding:5px 0;font-size:11px;font-weight:700;border:none;border-radius:5px;cursor:pointer;
                   background:${_tabPanelActivo==='transcurridas'?'#d97706':'var(--card-hover)'};
                   color:${_tabPanelActivo==='transcurridas'?'#fff':'var(--text-muted)'}">
            + Tiempo Pendiente (${transcurridas.length})
          </button>
        </div>
        <div id="panel-novedades-lista" style="overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px">
          ${_tabPanelActivo === 'criticas'
            ? (criticas.length === 0
                ? '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:12px">Sin incidencias criticas con coordenadas</div>'
                : criticas.map(p => _renderItem(p, false)).join(''))
            : (transcurridas.length === 0
                ? '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:12px">Sin novedades pendientes</div>'
                : transcurridas.map(p => _renderItem(p, true)).join(''))
          }
        </div>`;

      // Exponer función de cambio de tab
      window._sgtiTabPanel = function(tab) {
        _tabPanelActivo = tab;
        _actualizarPanelNovedades(points);
      };
    }

    function _obtenerMapa() {
      return window.mapHeat || window._sgtiHeatMapInstance || null;
    }

    // Enlaza el listener de cambio de filtro al selector (sin tocar actualizarMapaCalor del bundle)
    function _enlazarSelector() {
      const sel = document.getElementById('heat-filtro-grupo');
      if (!sel || sel.dataset.sgtiOk) return;
      sel.dataset.sgtiOk = '1';
      _inyectarOpcionCritico();

      sel.addEventListener('change', function() {
        // Siempre limpiar nuestras capas primero
        if (_modoActivo) {
          const map = _obtenerMapa();
          if (map) _limpiarCapasCritico(map);
          _modoActivo = false;
          _actualizarPanelNovedades([]);
        }
        if (sel.value !== 'critico') return;

        // Esperar brevemente a que el bundle procese el cambio, luego superponer nuestras capas
        setTimeout(async function() {
          const map = _obtenerMapa();
          if (map) {
            await _renderizarCritico(map);
          } else {
            setTimeout(async function() {
              const m2 = _obtenerMapa();
              if (m2) await _renderizarCritico(m2);
            }, 1000);
          }
        }, 300);
      });
    }

    // MutationObserver: inyecta la opción e inicializa el listener cuando el selector aparezca
    const obsHeat = new MutationObserver(function() {
      _inyectarOpcionCritico();
      _enlazarSelector();
    });
    obsHeat.observe(document.body, { childList: true, subtree: true });
  })();
  </script>

  <script>
  // ── Búsqueda de distrito peruano al crear municipio ──────────────────────────
  (function() {
    let _districtBoundaryGeoJSON = null;
    let _previewMap = null;
    let _boundaryLayer = null;
    let _sectorsLayer = null;
    let _searchTimer = null;
    let _nominatimResults = [];
    window._districtSectorsGeoJSON = null;

    // Aplica tema claro directamente con JS sobre el modal (CSS no gana contra inline styles del bundle)
    window._applyTenantModalTheme = function() {
      const modal = document.getElementById('tenant-modal');
      if (!modal) return;

      // Caja del modal
      const box = modal.querySelector('div');
      if (box) {
        Object.assign(box.style, {
          background:    '#ffffff',
          border:        '1px solid #bfdbfe',
          borderRadius:  '16px',
          boxShadow:     '0 24px 80px rgba(15,23,42,0.45)',
          maxHeight:     '88vh',
          overflowY:     'auto',
        });
      }

      // Título
      const title = document.getElementById('tenant-modal-title');
      if (title) Object.assign(title.style, {
        color: '#1d4ed8', fontWeight: '800', fontSize: '17px',
        marginBottom: '16px', paddingBottom: '12px',
        borderBottom: '2px solid #bfdbfe',
      });

      // Labels
      modal.querySelectorAll('label').forEach(el => { el.style.color = '#475569'; });

      // Inputs y selects
      modal.querySelectorAll('input:not([type=hidden]):not([type=file]), select').forEach(el => {
        Object.assign(el.style, {
          background:   '#f0f9ff',
          border:       '1px solid #bae6fd',
          color:        '#0f172a',
          borderRadius: '8px',
        });
      });

      // Botones de guardar / cancelar que crea el bundle
      modal.querySelectorAll('button').forEach(btn => {
        const txt = btn.textContent.trim().toLowerCase();
        if (txt.includes('cancel') || txt.includes('cerrar')) {
          Object.assign(btn.style, { background: '#f1f5f9', color: '#475569', border: '1px solid #cbd5e1' });
        }
      });

      // Textos genéricos (divs con color oscuro heredado del dark-mode)
      modal.querySelectorAll('p, span:not([style*="color:#"])').forEach(el => {
        if (!el.style.color) el.style.color = '#334155';
      });
    };

    // Interceptar abrirModalNuevoTenant (definido en el bundle) para inyectar el autocomplete
    let _origCrear;
    Object.defineProperty(window, 'abrirModalNuevoTenant', {
      configurable: true,
      get() { return _origCrear; },
      set(fn) {
        _origCrear = function(...a) {
          window._districtSectorsGeoJSON = null;
          _districtBoundaryGeoJSON = null;
          // Ocultar mapa y limpiar si ya estaba abierto antes
          const mw = document.getElementById('district-map-wrap');
          if (mw) mw.style.display = 'none';
          const dd = document.getElementById('district-dropdown');
          if (dd) dd.style.display = 'none';
          const eb = document.getElementById('escudo-banner');
          if (eb) eb.remove();
          const st = document.getElementById('logo-upload-status');
          if (st) st.textContent = '';
          const lf = document.getElementById('logo-file-input');
          if (lf) lf.value = '';
          const li = document.getElementById('tenant-logoUrl');
          if (li) li.value = '';
          const r = fn.apply(this, a);
          setTimeout(() => { window._applyTenantModalTheme(); window._enhanceDistrictForm(); }, 80);
          return r;
        };
      }
    });

    // Interceptar editarTenant para aplicar tema y ocultar panel de mapa
    let _origEditar;
    Object.defineProperty(window, 'editarTenant', {
      configurable: true,
      get() { return _origEditar; },
      set(fn) {
        _origEditar = function(...a) {
          const r = fn.apply(this, a);
          setTimeout(() => {
            window._applyTenantModalTheme();
            const mw = document.getElementById('district-map-wrap');
            if (mw) mw.style.display = 'none';
            const dd = document.getElementById('district-dropdown');
            if (dd) dd.style.display = 'none';
          }, 80);
          return r;
        };
      }
    });

    // Interceptar guardarTenant para auto-setear logoUrl, guardar GeoJSON y nombreProvincia
    let _origGuardar;
    Object.defineProperty(window, 'guardarTenant', {
      configurable: true,
      get() { return _origGuardar; },
      set(fn) {
        _origGuardar = async function(...a) {
          const tenantId   = document.getElementById('tenant-id')?.value || '';
          const isCreate   = !tenantId;
          const subdominio = (document.getElementById('tenant-subdominio')?.value || '').toLowerCase().trim();
          const nombreProv = document.getElementById('tenant-nombreProvincia')?.value || '';
          const logoInp    = document.getElementById('tenant-logoUrl');
          const dist       = document.getElementById('tenant-nombreDistrito')?.value || '';

          // Buscar escudo una sola vez y guardar la URL
          let escudoUrl = logoInp?.value || '';
          if (!escudoUrl && dist) {
            try {
              const params = new URLSearchParams({ dist, prov: nombreProv });
              const r = await fetch(`/api/superadmin/escudo-lookup?${params}`);
              const d = await r.json();
              if (d.url) escudoUrl = d.url;
            } catch(e) {}
          }
          // Inyectar en el campo para que el original lo incluya en el POST
          if (logoInp && escudoUrl && !logoInp.value) logoInp.value = escudoUrl;

          const resultado = await fn.apply(this, a);
          const modal     = document.getElementById('tenant-modal');
          const exito     = !modal || modal.style.display === 'none';

          if (exito && subdominio) {
            const tk = localStorage.getItem('sgti_token') || '';

            if (isCreate && window._districtSectorsGeoJSON) {
              fetch(`/api/superadmin/tenants/${subdominio}/geojson`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tk}` },
                body: JSON.stringify({ geojson: window._districtSectorsGeoJSON })
              }).catch(() => {});
              window._districtSectorsGeoJSON = null;
            }

            // PUT garantizado: persiste logoUrl + nombreProvincia en BD
            const putBody = {};
            if (escudoUrl) putBody.logoUrl = escudoUrl;
            if (nombreProv) putBody.nombreProvincia = nombreProv;

            if (Object.keys(putBody).length) {
              fetch(`/api/superadmin/tenants/${subdominio}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tk}` },
                body: JSON.stringify(putBody)
              }).then(() => {
                // Tras el PUT, actualizar la celda logo del row correspondiente
                if (escudoUrl) {
                  const rows = document.querySelectorAll('#tenants-table-body tr');
                  for (const row of rows) {
                    const code = row.cells[3]?.querySelector('code');
                    if (code && code.textContent.trim() === subdominio) {
                      if (!row.cells[1]?.querySelector('img')) {
                        row.cells[1].innerHTML = `<img src="${escudoUrl}" style="height:30px;width:46px;object-fit:contain;border-radius:4px;">`;
                      }
                      break;
                    }
                  }
                }
              }).catch(() => {});
            }
          }
          return resultado;
        };
      }
    });

    window._enhanceDistrictForm = function() {
      const inp = document.getElementById('tenant-nombreDistrito');
      if (!inp || inp.dataset.districtEnhanced) return;
      inp.dataset.districtEnhanced = '1';
      inp.setAttribute('autocomplete', 'off');
      inp.placeholder = 'Escribe el nombre del distrito...';

      // Campo oculto para provincia (si no existe ya)
      if (!document.getElementById('tenant-nombreProvincia')) {
        const ph = document.createElement('input');
        ph.type = 'hidden';
        ph.id   = 'tenant-nombreProvincia';
        inp.parentNode.appendChild(ph);
      }

      // Wrapper para posicionar el dropdown
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:100%';
      inp.parentNode.insertBefore(wrap, inp);
      wrap.appendChild(inp);

      // Dropdown de sugerencias
      const dd = document.createElement('div');
      dd.id = 'district-dropdown';
      dd.style.cssText = [
        'position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:99999',
        'background:#ffffff;border:1px solid #bfdbfe',
        'border-radius:10px;max-height:220px;overflow-y:auto;display:none',
        'box-shadow:0 8px 28px rgba(15,23,42,0.15)'
      ].join(';');
      wrap.appendChild(dd);

      // Widget de subida de logo (se inyecta justo debajo del campo logoUrl)
      const logoInpRef = document.getElementById('tenant-logoUrl');
      if (logoInpRef && !document.getElementById('logo-upload-wrap')) {
        const uploadWrap = document.createElement('div');
        uploadWrap.id = 'logo-upload-wrap';
        uploadWrap.style.cssText = 'margin-top:6px';
        uploadWrap.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <input type="file" id="logo-file-input" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none">
            <button type="button" id="logo-upload-btn"
              style="padding:4px 12px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer">
              Subir logo propio
            </button>
            <span id="logo-upload-status" style="font-size:11px;color:#64748b"></span>
          </div>
        `;
        logoInpRef.parentNode?.insertBefore(uploadWrap, logoInpRef.nextSibling);

        document.getElementById('logo-upload-btn').addEventListener('click', () => {
          document.getElementById('logo-file-input').click();
        });

        document.getElementById('logo-file-input').addEventListener('change', async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const statusEl = document.getElementById('logo-upload-status');
          const btn      = document.getElementById('logo-upload-btn');
          statusEl.textContent = 'Subiendo...';
          btn.disabled = true;
          try {
            const subdominio = document.getElementById('tenant-subdominio')?.value || '';
            const fd = new FormData();
            fd.append('logo', file);
            const tk = localStorage.getItem('sgti_token') || '';
            const res = await fetch(`/api/superadmin/upload-logo?subdominio=${encodeURIComponent(subdominio)}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${tk}` },
              body: fd,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al subir');
            const logoInp = document.getElementById('tenant-logoUrl');
            if (logoInp) {
              logoInp.value = data.url;
              logoInp.dispatchEvent(new Event('input', { bubbles: true }));
              logoInp.dispatchEvent(new Event('change', { bubbles: true }));
            }
            // Quitar banner de escudo si había uno (el usuario eligió su propio logo)
            const prev = document.getElementById('escudo-banner');
            if (prev) prev.remove();
            statusEl.innerHTML = '<span style="color:#16a34a;font-weight:700">✓ Logo subido correctamente</span>';
            btn.textContent = 'Cambiar logo';
          } catch(err) {
            statusEl.innerHTML = `<span style="color:#ef4444">${err.message}</span>`;
          } finally {
            btn.disabled = false;
            e.target.value = '';
          }
        });
      }

      // Panel de mapa (se añade al final del tenant-form)
      const mapWrap = document.createElement('div');
      mapWrap.id = 'district-map-wrap';
      mapWrap.style.cssText = 'display:none;margin-top:14px;';
      mapWrap.innerHTML = `
        <!-- Cabecera con tabs de modo -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
          <span style="font-size:11px;font-weight:700;color:var(--text-muted,#aaa);text-transform:uppercase;letter-spacing:.06em">
            Vista previa · Sectores del distrito
          </span>
          <div style="display:flex;gap:3px;background:#1e2a3a;border-radius:7px;padding:2px">
            <button id="district-mode-auto"
              style="padding:3px 10px;font-size:11px;font-weight:700;border-radius:5px;border:none;background:#3b82f6;color:#fff;cursor:pointer">
              Auto
            </button>
            <button id="district-mode-img"
              style="padding:3px 10px;font-size:11px;font-weight:700;border-radius:5px;border:none;background:transparent;color:#94a3b8;cursor:pointer">
              Imagen
            </button>
          </div>
        </div>

        <!-- Controles modo AUTO -->
        <div id="district-auto-ctrl" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
          <label style="font-size:11px;color:var(--text-muted,#aaa)">N° sectores:</label>
          <input type="number" id="district-nsectors" min="3" max="24" value="8"
            style="width:52px;padding:3px 6px;border-radius:5px;border:1px solid var(--border-light,#333);
                   background:var(--bg-input,#252d3d);color:var(--text-primary,#fff);font-size:12px;text-align:center">
          <button id="district-regen"
            style="padding:3px 12px;font-size:11px;font-weight:700;border-radius:5px;border:none;
                   background:var(--blue,#3b82f6);color:#fff;cursor:pointer">↺ Regenerar</button>
        </div>

        <!-- Controles modo IMAGEN -->
        <div id="district-img-ctrl" style="display:none;margin-bottom:6px">
          <input type="file" id="district-scan-input" accept="image/jpeg,image/png,image/webp" style="display:none">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <button id="district-scan-btn"
              style="padding:4px 12px;font-size:11px;font-weight:700;border-radius:5px;border:none;background:#7c3aed;color:#fff;cursor:pointer">
              Subir imagen escaneada
            </button>
            <span id="district-scan-status" style="font-size:11px;color:#94a3b8"></span>
          </div>
          <!-- Instrucciones de trazado (visible tras cargar imagen) -->
          <div id="district-draw-hint" style="display:none;margin-top:8px;padding:8px 10px;background:#1e2a3a;border:1px solid #3b5080;border-radius:6px">
            <div style="font-size:11px;color:#93c5fd;font-weight:600;margin-bottom:5px">
              Traza los sectores haciendo clic en el mapa. Doble clic para cerrar cada sector.
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <button id="district-cancel-poly"
                style="padding:2px 8px;font-size:10px;font-weight:700;border-radius:4px;border:1px solid #475569;background:transparent;color:#94a3b8;cursor:pointer">
                Cancelar trazo
              </button>
              <button id="district-clear-polys"
                style="padding:2px 8px;font-size:10px;font-weight:700;border-radius:4px;border:none;background:#ef4444;color:#fff;cursor:pointer">
                Borrar todo
              </button>
              <span id="district-poly-count" style="font-size:11px;color:#64748b">0 sectores trazados</span>
            </div>
          </div>
        </div>

        <div id="district-preview-map"
          style="height:230px;border-radius:8px;overflow:hidden;border:1px solid var(--border-light,#333)"></div>
        <div id="district-map-msg"
          style="margin-top:5px;font-size:11px;color:var(--text-muted,#aaa);text-align:center;min-height:14px"></div>
      `;
      const form = document.getElementById('tenant-form');
      if (form) form.appendChild(mapWrap);

      // Eventos del input
      inp.addEventListener('input', () => {
        const q = inp.value.trim();
        if (q.length < 2) { dd.style.display = 'none'; return; }
        clearTimeout(_searchTimer);
        _searchTimer = setTimeout(() => window._districtSearch(q, dd), 380);
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Escape') dd.style.display = 'none'; });
      document.addEventListener('click', e => {
        if (!wrap.contains(e.target)) dd.style.display = 'none';
      }, true);

      // Delegación de eventos en el dropdown
      dd.addEventListener('click', e => {
        const opt = e.target.closest('.d-opt');
        if (!opt) return;
        window._districtSelect(_nominatimResults[+opt.dataset.i]);
      });

      document.getElementById('district-regen')?.addEventListener('click', () => {
        if (_districtBoundaryGeoJSON) window._districtGenSectors(_districtBoundaryGeoJSON);
      });
      document.getElementById('district-nsectors')?.addEventListener('change', () => {
        if (_districtBoundaryGeoJSON) window._districtGenSectors(_districtBoundaryGeoJSON);
      });

      // ── Tabs Auto / Imagen ────────────────────────────────────────────────
      document.getElementById('district-mode-auto')?.addEventListener('click', () => {
        document.getElementById('district-auto-ctrl').style.display = 'flex';
        document.getElementById('district-img-ctrl').style.display  = 'none';
        document.getElementById('district-mode-auto').style.cssText += ';background:#3b82f6;color:#fff';
        document.getElementById('district-mode-img').style.cssText  += ';background:transparent;color:#94a3b8';
        window._disableScanDrawMode();
        // Quitar imagen superpuesta si la había
        if (window._scanOverlay && _previewMap) { _previewMap.removeLayer(window._scanOverlay); window._scanOverlay = null; }
        // Regenerar sectores automáticos
        if (_districtBoundaryGeoJSON) window._districtGenSectors(_districtBoundaryGeoJSON);
      });

      document.getElementById('district-mode-img')?.addEventListener('click', () => {
        document.getElementById('district-auto-ctrl').style.display = 'none';
        document.getElementById('district-img-ctrl').style.display  = 'block';
        document.getElementById('district-mode-img').style.cssText  += ';background:#7c3aed;color:#fff';
        document.getElementById('district-mode-auto').style.cssText += ';background:transparent;color:#94a3b8';
        // Limpiar sectores auto para no mezclar con los trazados a mano
        if (_sectorsLayer && _previewMap) { _previewMap.removeLayer(_sectorsLayer); _sectorsLayer = null; }
        window._districtSectorsGeoJSON = null;
        window._scanDrawnSectors = [];
        const msg = document.getElementById('district-map-msg');
        if (msg) msg.textContent = 'Sube tu imagen escaneada y traza los sectores encima.';
      });

      // ── Subida de imagen escaneada ────────────────────────────────────────
      document.getElementById('district-scan-btn')?.addEventListener('click', () => {
        document.getElementById('district-scan-input').click();
      });

      document.getElementById('district-scan-input')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const statusEl = document.getElementById('district-scan-status');
        statusEl.textContent = 'Cargando...';
        const reader = new FileReader();
        reader.onload = (ev) => {
          const imgUrl = ev.target.result;
          if (!_previewMap || !_districtBoundaryGeoJSON) {
            statusEl.textContent = 'Primero selecciona un distrito.';
            return;
          }
          // Quitar overlay previo
          if (window._scanOverlay) { _previewMap.removeLayer(window._scanOverlay); window._scanOverlay = null; }
          // Calcular bounds del distrito para colocar la imagen
          const feat = _districtBoundaryGeoJSON.type === 'Feature'
            ? _districtBoundaryGeoJSON
            : { type: 'Feature', geometry: _districtBoundaryGeoJSON, properties: {} };
          const bounds = L.geoJSON(feat).getBounds();
          window._scanOverlay = L.imageOverlay(imgUrl, bounds, { opacity: 0.55, interactive: false }).addTo(_previewMap);
          _previewMap.fitBounds(bounds, { padding: [8, 8] });
          statusEl.innerHTML = '<span style="color:#a78bfa;font-weight:700">✓ Imagen cargada</span>';
          document.getElementById('district-draw-hint').style.display = 'block';
          window._enableScanDrawMode();
          e.target.value = '';
        };
        reader.readAsDataURL(file);
      });

      // ── Cancelar trazo actual / Borrar todo ──────────────────────────────
      document.getElementById('district-cancel-poly')?.addEventListener('click', () => {
        window._cancelCurrentPoly();
      });
      document.getElementById('district-clear-polys')?.addEventListener('click', () => {
        window._clearAllPolys();
      });
    };

    window._districtSearch = async function(q, dd) {
      dd.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#64748b">Buscando...</div>';
      dd.style.display = 'block';
      try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' Peru')}&countrycodes=pe&addressdetails=1&format=json&limit=10&accept-language=es`;
        const data = await (await fetch(url)).json();
        _nominatimResults = data;
        if (!data.length) {
          dd.innerHTML = `<div style="padding:10px 12px;font-size:12px;color:#64748b">Sin resultados para "${q}"</div>`;
          return;
        }
        dd.innerHTML = data.map((r, i) => {
          const a    = r.address || {};
          const dist = a.municipality || a.city_district || a.suburb || a.village || a.city || a.town || r.display_name.split(',')[0];
          const prov = a.county || a.state_district || '';
          const dep  = a.state || '';
          return `<div class="d-opt" data-i="${i}" style="
            padding:9px 12px;cursor:pointer;border-bottom:1px solid #e2e8f0;
            background:#ffffff;transition:background .12s
          " onmouseover="this.style.background='#e0f2fe'"
             onmouseout="this.style.background='#ffffff'">
            <div style="font-size:13px;font-weight:600;color:#0f172a">${dist}</div>
            <div style="font-size:11px;color:#64748b;margin-top:1px">${[prov, dep].filter(Boolean).join(' · ')}</div>
          </div>`;
        }).join('');
      } catch(e) {
        dd.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#ef4444">Error de conexión</div>';
      }
    };

    window._districtSelect = async function(result) {
      if (!result) return;
      const a = result.address || {};
      const dist = (a.municipality || a.city_district || a.suburb || a.village || a.city || a.town || result.display_name.split(',')[0]).trim();
      const prov = (a.county || a.state_district || '').trim();

      const nombreInp = document.getElementById('tenant-nombreDistrito');
      const subInp    = document.getElementById('tenant-subdominio');
      const provInp   = document.getElementById('tenant-nombreProvincia');
      if (nombreInp) nombreInp.value = dist;
      if (provInp)   provInp.value   = prov;
      // Guardar en memoria para que _fillTenantLogos lo use inmediatamente tras crear
      window._provByNombre?.set(dist, prov);
      if (subInp && !subInp.value) {
        subInp.value = dist.toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      const dd = document.getElementById('district-dropdown');
      if (dd) dd.style.display = 'none';

      const mw = document.getElementById('district-map-wrap');
      if (mw) mw.style.display = 'block';

      const msg = document.getElementById('district-map-msg');
      if (msg) msg.textContent = 'Obteniendo límites del distrito...';

      // ── Escudo municipal automático ──────────────────────────────────────
      window._fetchEscudo(dist, prov);

      try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(result.display_name)}&format=json&limit=1&polygon_geojson=1&addressdetails=1`;
        const [geo] = await (await fetch(url)).json();
        if (!geo?.geojson) {
          if (msg) msg.textContent = 'No se encontraron límites para este distrito.';
          return;
        }
        _districtBoundaryGeoJSON = geo.geojson;
        window._districtRenderMap(geo.geojson);
        window._districtGenSectors(geo.geojson);
      } catch(e) {
        if (msg) msg.textContent = 'Error al obtener límites del distrito.';
      }
    };

    window._normEscudo = function(s) {
      return (s || '').toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    };
    // alias local para uso interno del IIFE
    const _normEscudo = window._normEscudo;

    window._probeImage = function(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload  = () => resolve(url);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    };
    const _probeImage = window._probeImage;

    window._fetchEscudo = async function(distrito, provincia) {
      // Eliminar banner previo si existe
      const prevBanner = document.getElementById('escudo-banner');
      if (prevBanner) prevBanner.remove();

      const logoInp = document.getElementById('tenant-logoUrl');
      if (!logoInp) return;

      const key = _normEscudo(distrito) + '_' + _normEscudo(provincia);
      // Probar extensiones en orden de probabilidad
      let url = null;
      for (const ext of ['svg', 'png', 'jpg']) {
        url = await _probeImage(`/escudos/${key}.${ext}`);
        if (url) break;
      }
      if (!url) return;

      const banner = document.createElement('div');
      banner.id = 'escudo-banner';
      banner.style.cssText = [
        'display:flex;align-items:center;gap:10px;margin-top:8px;margin-bottom:6px',
        'background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px',
      ].join(';');
      banner.innerHTML = `
        <img src="${url}" alt="Escudo" style="width:36px;height:36px;object-fit:contain;border-radius:4px;border:1px solid #e2e8f0;background:#fff;padding:2px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;font-weight:700;color:#1d4ed8">Escudo oficial encontrado</div>
          <div style="font-size:10px;color:#64748b;margin-top:1px">${distrito}</div>
        </div>
        <button type="button" id="escudo-usar-btn"
          style="padding:4px 10px;font-size:11px;font-weight:700;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0">
          Usar escudo
        </button>
      `;

      // Insertar antes del widget de subida (si ya existe) o después del campo logoUrl
      const uploadWrap = document.getElementById('logo-upload-wrap');
      if (uploadWrap) {
        uploadWrap.parentNode.insertBefore(banner, uploadWrap);
      } else {
        logoInp.parentNode?.insertBefore(banner, logoInp.nextSibling);
      }

      document.getElementById('escudo-usar-btn')?.addEventListener('click', () => {
        logoInp.value = url;
        logoInp.dispatchEvent(new Event('input', { bubbles: true }));
        logoInp.dispatchEvent(new Event('change', { bubbles: true }));
        banner.style.background = '#f0fdf4';
        banner.style.borderColor = '#86efac';
        const btn = document.getElementById('escudo-usar-btn');
        if (btn) { btn.textContent = '✓ Aplicado'; btn.style.background = '#16a34a'; btn.disabled = true; }
        // Limpiar status del upload si el usuario elige el escudo en vez de su archivo
        const statusEl = document.getElementById('logo-upload-status');
        if (statusEl) statusEl.textContent = '';
      });
    };

    window._districtRenderMap = function(geojson) {
      const container = document.getElementById('district-preview-map');
      if (!container) return;
      if (_previewMap) { _previewMap.remove(); _previewMap = null; _boundaryLayer = null; _sectorsLayer = null; }
      _previewMap = L.map(container, { zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(_previewMap);
      const feat = geojson.type === 'Feature' ? geojson : { type: 'Feature', geometry: geojson, properties: {} };
      _boundaryLayer = L.geoJSON(feat, {
        style: { color: '#3b82f6', weight: 2.5, fillColor: '#3b82f6', fillOpacity: 0.12 }
      }).addTo(_previewMap);
      _previewMap.fitBounds(_boundaryLayer.getBounds(), { padding: [12, 12] });
    };

    window._districtGenSectors = function(geojson) {
      if (!window.turf || !_previewMap) return;
      const nEl = document.getElementById('district-nsectors');
      const n   = Math.max(3, Math.min(24, parseInt(nEl?.value || '8', 10)));
      const msg = document.getElementById('district-map-msg');
      try {
        const feat = geojson.type === 'Feature' ? geojson : turf.feature(geojson);
        const bbox = turf.bbox(feat);
        // Generar puntos aleatorios dentro del límite
        let pts = [];
        let tries = 0;
        while (pts.length < n && tries < 40) {
          turf.randomPoint(n * 4, { bbox }).features.forEach(p => {
            if (pts.length < n) {
              try { if (turf.booleanPointInPolygon(p, feat)) pts.push(p); } catch(e) {}
            }
          });
          tries++;
        }
        if (pts.length < 2) { if (msg) msg.textContent = 'No se pudo generar sectores.'; return; }

        const voronoi = turf.voronoi(turf.featureCollection(pts.slice(0, n)), { bbox });
        const feats = [];
        voronoi.features.forEach((cell, i) => {
          try {
            const clip = turf.intersect(cell, feat);
            if (clip) {
              clip.properties = { fid: feats.length + 1, id: feats.length + 1, Name: `Sector ${feats.length + 1}` };
              feats.push(clip);
            }
          } catch(e) {}
        });

        if (!feats.length) { if (msg) msg.textContent = 'Error al recortar sectores.'; return; }

        const sectors = turf.featureCollection(feats);
        window._districtSectorsGeoJSON = sectors;

        if (_sectorsLayer) { _previewMap.removeLayer(_sectorsLayer); _sectorsLayer = null; }
        const COLS = ['#e63946','#2a9d8f','#e9c46a','#6a4fcf','#f4a261','#457b9d','#e76f51','#2dc653','#ff6b6b','#118ab2','#ffd166','#9b5de5'];
        _sectorsLayer = L.geoJSON(sectors, {
          style: f => ({
            color: '#fff', weight: 2,
            fillColor: COLS[(f.properties.id - 1) % COLS.length],
            fillOpacity: 0.82
          }),
          onEachFeature: (f, layer) => {
            layer.bindTooltip(f.properties.Name, { permanent: true, direction: 'center', className: 'leaflet-tooltip-mini' });
          }
        }).addTo(_previewMap);

        if (msg) msg.textContent = `✓ ${feats.length} sectores generados — ajusta la cantidad y presiona Regenerar`;
      } catch(e) {
        if (msg) msg.textContent = 'Error: ' + e.message;
      }
    };

    // ── Dibujo manual de polígonos (modo imagen escaneada) ───────────────
    window._scanDrawnSectors  = [];   // features GeoJSON finalizados
    window._scanCurrentPts    = [];   // vértices del polígono en curso
    window._scanOverlay       = null; // L.imageOverlay activo
    window._scanPolyLine      = null; // polilínea de preview del trazo
    window._scanDotLayers     = [];   // marcadores de vértices
    window._scanFinishedLayers= [];   // polígonos ya cerrados

    const SCAN_COLORS = ['#e63946','#2a9d8f','#e9c46a','#6a4fcf','#f4a261','#457b9d','#e76f51','#2dc653','#ff6b6b','#118ab2','#ffd166','#9b5de5'];

    window._enableScanDrawMode = function() {
      if (!_previewMap) return;
      _previewMap.on('click',    window._scanMapClick);
      _previewMap.on('dblclick', window._scanMapDblClick);
      _previewMap.getContainer().style.cursor = 'crosshair';
    };

    window._disableScanDrawMode = function() {
      if (!_previewMap) return;
      _previewMap.off('click',    window._scanMapClick);
      _previewMap.off('dblclick', window._scanMapDblClick);
      _previewMap.getContainer().style.cursor = '';
    };

    window._scanMapClick = function(e) {
      // Leaflet dispara click antes que dblclick — ignorar el 2.º click del doble
      if (window._scanDblGuard) { window._scanDblGuard = false; return; }
      const pt = [e.latlng.lat, e.latlng.lng];
      window._scanCurrentPts.push(pt);

      // Dot de vértice
      const dot = L.circleMarker(pt, { radius: 4, color: '#a78bfa', fillColor: '#a78bfa', fillOpacity: 1, weight: 1 }).addTo(_previewMap);
      window._scanDotLayers.push(dot);

      // Línea de preview
      if (window._scanPolyLine) _previewMap.removeLayer(window._scanPolyLine);
      if (window._scanCurrentPts.length >= 2) {
        window._scanPolyLine = L.polyline(window._scanCurrentPts, { color: '#a78bfa', weight: 2, dashArray: '5 4' }).addTo(_previewMap);
      }
    };

    window._scanMapDblClick = function() {
      window._scanDblGuard = true;
      if (window._scanCurrentPts.length < 3) {
        window._cancelCurrentPoly();
        return;
      }
      window._closePoly();
    };

    window._closePoly = function() {
      const pts = window._scanCurrentPts;
      if (pts.length < 3) return;

      const idx   = window._scanDrawnSectors.length + 1;
      const color = SCAN_COLORS[(idx - 1) % SCAN_COLORS.length];

      // Polígono permanente en el mapa
      const poly = L.polygon(pts, { color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.72 }).addTo(_previewMap);
      poly.bindTooltip(`Sector ${idx}`, { permanent: true, direction: 'center', className: 'leaflet-tooltip-mini' });
      window._scanFinishedLayers.push(poly);

      // Feature GeoJSON
      const ring = [...pts.map(p => [p[1], p[0]]), [pts[0][1], pts[0][0]]];
      window._scanDrawnSectors.push({
        type: 'Feature',
        properties: { fid: idx, id: idx, Name: `Sector ${idx}` },
        geometry: { type: 'Polygon', coordinates: [ring] }
      });
      window._districtSectorsGeoJSON = { type: 'FeatureCollection', features: window._scanDrawnSectors };

      // Limpiar trazo en curso
      window._clearCurrentTrace();

      // Actualizar contador y mensaje
      const n   = window._scanDrawnSectors.length;
      const cnt = document.getElementById('district-poly-count');
      if (cnt) cnt.textContent = `${n} sector${n !== 1 ? 'es' : ''} trazado${n !== 1 ? 's' : ''}`;
      const msg = document.getElementById('district-map-msg');
      if (msg) msg.textContent = `✓ ${n} sector${n !== 1 ? 'es' : ''} — sigue trazando o guarda el municipio.`;
    };

    window._cancelCurrentPoly = function() {
      window._clearCurrentTrace();
      const msg = document.getElementById('district-map-msg');
      if (msg && window._scanDrawnSectors.length === 0) msg.textContent = 'Trazo cancelado. Haz clic para empezar de nuevo.';
    };

    window._clearCurrentTrace = function() {
      if (window._scanPolyLine) { _previewMap?.removeLayer(window._scanPolyLine); window._scanPolyLine = null; }
      window._scanDotLayers.forEach(d => _previewMap?.removeLayer(d));
      window._scanDotLayers = [];
      window._scanCurrentPts = [];
    };

    window._clearAllPolys = function() {
      window._clearCurrentTrace();
      window._scanFinishedLayers.forEach(l => _previewMap?.removeLayer(l));
      window._scanFinishedLayers = [];
      window._scanDrawnSectors   = [];
      window._districtSectorsGeoJSON = null;
      const cnt = document.getElementById('district-poly-count');
      if (cnt) cnt.textContent = '0 sectores trazados';
      const msg = document.getElementById('district-map-msg');
      if (msg) msg.textContent = 'Sectores borrados. Traza de nuevo.';
    };

    // Estilos para tooltips del mini mapa
    const st = document.createElement('style');
    st.textContent = `.leaflet-tooltip-mini{background:transparent;border:none;box-shadow:none;color:#fff;font-size:9px;font-weight:700;padding:0;text-shadow:0 1px 2px rgba(0,0,0,.8)}`;
    document.head.appendChild(st);
  })();

  window.guardarCredenciales = async function() {
    const tenantId = document.getElementById('cred-tenant-id').value;
    const userId = document.getElementById('cred-user-id').value;
    const username = document.getElementById('cred-username').value.trim();
    const password = document.getElementById('cred-password').value;
    const msg = document.getElementById('cred-msg');

    if (!username && !password) { msg.style.color='#ef4444'; msg.textContent='Ingresa al menos usuario o contraseña.'; return; }

    const token = localStorage.getItem('sgti_token');
    try {
      msg.style.color='var(--text-muted)'; msg.textContent='Guardando...';
      const res = await fetch('/api/superadmin/tenants/' + tenantId + '/usuarios/' + userId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ username: username || undefined, password: password || undefined })
      });
      const data = await res.json();
      if (!res.ok) { msg.style.color='#ef4444'; msg.textContent = data.error || 'Error al guardar.'; return; }
      msg.style.color='#22c55e'; msg.textContent = '✓ ' + data.mensaje;
      setTimeout(() => document.getElementById('modal-credenciales').style.display='none', 1500);
    } catch(e) {
      msg.style.color='#ef4444'; msg.textContent='Error de conexión.';
    }
  };
  </script>

  <script>
  // Eliminar texto "v5 Premium" del sidebar
  (function() {
    function _quitarVersion() {
      document.querySelectorAll('span, div').forEach(el => {
        if (el.children.length === 0 && /^v\d+\s+(Premium|Pro|Plus|Beta)$/i.test(el.textContent.trim())) {
          el.style.display = 'none';
        }
      });
    }
    const obs = new MutationObserver(_quitarVersion);
    obs.observe(document.body, { childList: true, subtree: true });
    _quitarVersion();
